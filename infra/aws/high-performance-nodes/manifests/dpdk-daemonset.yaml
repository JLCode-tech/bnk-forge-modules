apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dpdk-configurator
  namespace: kube-system
  labels:
    app: dpdk-configurator
spec:
  selector:
    matchLabels:
      app: dpdk-configurator
  template:
    metadata:
      labels:
        app: dpdk-configurator
    spec:
      serviceAccountName: dpdk-configurator
      hostNetwork: true
      hostPID: true
      nodeSelector:
        node-type: high-performance
      tolerations:
      - key: high-performance
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: f5.com/spk-node
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: dpdk-setup
        image: amazonlinux:2
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          
          log() {
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a /host/var/log/dpdk-setup.log
          }
          
          log "Starting complete DPDK setup..."
          
          # Install required packages
          log "Installing packages..."
          chroot /host yum install -y python3 wget pciutils git gcc make kernel-devel kernel-headers numactl-devel libhugetlbfs-utils libpcap-devel
          
          # Create DPDK directory
          chroot /host mkdir -p /opt/dpdk/
          
          # Create complete dpdk-devbind.py script (the one that worked in manual test)
          log "Creating DPDK binding script..."
          cat > /host/opt/dpdk/dpdk-devbind.py << 'DPDK_EOF'
          #!/usr/bin/env python3
          import subprocess
          import sys
          
          def run_cmd(cmd):
              try:
                  result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
                  return result.returncode, result.stdout, result.stderr
              except Exception as e:
                  return 1, "", str(e)
          
          def get_ena_devices():
              ret, out, err = run_cmd("lspci -d 1d0f:")
              devices = []
              for line in out.strip().split('\n'):
                  if line and 'Ethernet' in line:
                      pci_addr = line.split()[0]
                      devices.append(f"0000:{pci_addr}")
              return devices
          
          def get_driver_info(pci_addr):
              ret, out, err = run_cmd(f"readlink /sys/bus/pci/devices/{pci_addr}/driver 2>/dev/null")
              driver = out.strip().split('/')[-1] if out.strip() else "none"
              
              interface = ""
              ret, out, err = run_cmd(f"ls /sys/bus/pci/devices/{pci_addr}/net/ 2>/dev/null")
              if ret == 0 and out.strip():
                  interface = out.strip().split()[0]
              
              active = False
              if interface:
                  ret, out, err = run_cmd(f"ip link show {interface} 2>/dev/null | grep 'state UP'")
                  active = ret == 0
              
              return driver, interface, active
          
          def bind_device(pci_addr, driver):
              print(f"Binding {pci_addr} to {driver}")
              
              current_driver, _, _ = get_driver_info(pci_addr)
              
              if current_driver == driver:
                  print(f"Device {pci_addr} already bound to {driver}")
                  return True
              
              if current_driver != "none":
                  print(f"  Unbinding from {current_driver}")
                  run_cmd(f"echo {pci_addr} > /sys/bus/pci/devices/{pci_addr}/driver/unbind")
              
              print(f"  Setting driver override to {driver}")
              ret, out, err = run_cmd(f"echo {driver} > /sys/bus/pci/devices/{pci_addr}/driver_override")
              if ret != 0:
                  print(f"  Error: Failed to set driver override: {err}")
                  return False
              
              if driver == "vfio-pci":
                  print("  Loading vfio-pci module")
                  run_cmd("modprobe vfio-pci")
                  print("  Adding ENA device ID to vfio-pci")
                  run_cmd("echo '1d0f ec20' > /sys/bus/pci/drivers/vfio-pci/new_id")
                  ret, out, err = run_cmd("ls /sys/kernel/iommu_groups/ | wc -l")
                  if ret == 0 and int(out.strip()) <= 2:
                      print("  Enabling unsafe NOIOMMU mode")
                      run_cmd("echo 1 > /sys/module/vfio/parameters/enable_unsafe_noiommu_mode")
              
              print(f"  Probing device to bind to {driver}")
              ret, out, err = run_cmd(f"echo {pci_addr} > /sys/bus/pci/drivers_probe")
              if ret != 0:
                  print(f"  Error: Failed to probe device: {err}")
                  return False
              
              new_driver, _, _ = get_driver_info(pci_addr)
              if new_driver == driver:
                  print(f"  Successfully bound {pci_addr} to {driver}")
                  return True
              else:
                  print(f"  Error: Device bound to {new_driver} instead of {driver}")
                  return False
          
          def show_status():
              devices = get_ena_devices()
              dpdk_devices = []
              kernel_devices = []
              
              for dev in devices:
                  driver, interface, active = get_driver_info(dev)
                  if driver == "vfio-pci":
                      dpdk_devices.append({'addr': dev, 'driver': driver})
                  else:
                      kernel_devices.append({'addr': dev, 'driver': driver, 'interface': interface, 'active': active})
              
              if dpdk_devices:
                  print("Network devices using DPDK-compatible driver")
                  print("============================================")
                  for dev in dpdk_devices:
                      print(f"{dev['addr']} 'Elastic Network Adapter (ENA) ec20' drv={dev['driver']} unused=ena")
              
              if kernel_devices:
                  print("\\nNetwork devices using kernel driver")
                  print("===================================")
                  for dev in kernel_devices:
                      active_str = " *Active*" if dev['active'] else ""
                      if dev['interface']:
                          print(f"{dev['addr']} 'Elastic Network Adapter (ENA) ec20' if={dev['interface']} drv={dev['driver']} unused=vfio-pci{active_str}")
                      else:
                          print(f"{dev['addr']} '{dev['driver']}'")
          
          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  show_status()
              elif sys.argv[1] == "--status":
                  show_status()
              elif sys.argv[1] == "--bind":
                  if len(sys.argv) != 4:
                      print("Usage: dpdk-devbind.py --bind <driver> <pci_addr>")
                      sys.exit(1)
                  success = bind_device(sys.argv[3], sys.argv[2])
                  if not success:
                      sys.exit(1)
              else:
                  show_status()
          DPDK_EOF
          
          chmod +x /host/opt/dpdk/dpdk-devbind.py
          
          # Setup hugepages
          log "Setting up hugepages..."
          chroot /host bash -c "
            echo 4096 > /sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages
            echo 2 > /sys/kernel/mm/hugepages/hugepages-1048576kB/nr_hugepages
            mkdir -p /mnt/huge-2m /mnt/huge-1g
            mount -t hugetlbfs -o pagesize=2M nodev /mnt/huge-2m 2>/dev/null || true
            mount -t hugetlbfs -o pagesize=1G nodev /mnt/huge-1g 2>/dev/null || true
          "
          
          # Load VFIO modules
          log "Loading VFIO modules..."
          chroot /host bash -c "
            modprobe vfio-pci
            echo 1 > /sys/module/vfio/parameters/enable_unsafe_noiommu_mode
          "
          
          # Show current status
          log "Current PCI device status:"
          chroot /host /opt/dpdk/dpdk-devbind.py --status
          
          # Bind devices to DPDK
          log "Binding devices to DPDK..."
          chroot /host /opt/dpdk/dpdk-devbind.py --bind vfio-pci 0000:00:06.0
          chroot /host /opt/dpdk/dpdk-devbind.py --bind vfio-pci 0000:00:07.0
          
          # Show final binding status
          log "Final PCI device status:"
          chroot /host /opt/dpdk/dpdk-devbind.py --status
          
          # Install SR-IOV CNI
          log "Installing SR-IOV CNI..."
          # Sentinel: Removed insecure wget download. SR-IOV CNI is installed by sriov-cni-installer-x86.yaml
          # which uses a pinned container image (ghcr.io/k8snetworkplumbingwg/sriov-cni:v2.8.0).
          # The binary will be available at /opt/cni/bin/sriov on the host.
          if [ -f /host/opt/cni/bin/sriov ]; then
            log "SR-IOV CNI binary found at /opt/cni/bin/sriov"
          else
            log "WARNING: SR-IOV CNI binary NOT found at /opt/cni/bin/sriov. Ensure sriov-cni-installer is running."
          fi
          
          # Create SR-IOV device plugin configuration
          log "Creating SR-IOV configuration..."
          chroot /host mkdir -p /etc/pcidp/
          cat > /host/etc/pcidp/config.json << 'CONFIG_EOF'
          {
            "resourceList": [
              {
                "resourceName": "internal_netdevice",
                "selectors": {
                  "vendors": ["1d0f"],
                  "devices": ["ec20"],
                  "drivers": ["ena", "vfio-pci"],
                  "pciAddresses": ["0000:00:06.0"]
                }
              },
              {
                "resourceName": "external_netdevice",
                "selectors": {
                  "vendors": ["1d0f"],
                  "devices": ["ec20"],
                  "drivers": ["ena", "vfio-pci"],
                  "pciAddresses": ["0000:00:07.0"]
                }
              }
            ]
          }
          CONFIG_EOF
          
          # Apply performance optimizations
          log "Applying performance optimizations..."
          chroot /host bash -c "
            echo never > /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null || true
            echo never > /sys/kernel/mm/transparent_hugepage/defrag 2>/dev/null || true
          "
          
          # Final verification
          log "=== FINAL VERIFICATION ==="
          chroot /host bash -c "
            echo 'Hugepages status:'
            grep -i huge /proc/meminfo
            echo ''
            echo 'DPDK device binding status:'
            /opt/dpdk/dpdk-devbind.py --status
            echo ''
            echo 'SR-IOV CNI binary:'
            ls -la /opt/cni/bin/sriov
            echo ''
            echo 'SR-IOV configuration:'
            cat /etc/pcidp/config.json
          "
          
          log "DPDK configuration completed successfully!"
          
          # Keep container running and monitor
          while true; do
            sleep 300
            log "DPDK configurator monitoring..."
            bound_count=$(chroot /host /opt/dpdk/dpdk-devbind.py --status | grep -c 'drv=vfio-pci' || echo '0')
            log "DPDK devices bound: $bound_count"
          done
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-root
          mountPath: /host
      volumes:
      - name: host-root
        hostPath:
          path: /