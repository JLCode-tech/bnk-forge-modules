apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sriov-cni-installer-x86
  namespace: kube-system
  labels:
    app: sriov-cni-installer
    arch: amd64
spec:
  selector:
    matchLabels:
      app: sriov-cni-installer
      arch: amd64
  template:
    metadata:
      labels:
        app: sriov-cni-installer
        arch: amd64
    spec:
      hostNetwork: true
      nodeSelector:
        node-type: high-performance
        kubernetes.io/arch: amd64
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: high-performance
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: f5.com/spk-node
        operator: Equal
        value: "true"
        effect: NoSchedule
      initContainers:
      - name: install-sriov-cni
        # Sentinel: Pinned version to avoid mutable tag 'latest'
        image: ghcr.io/k8snetworkplumbingwg/sriov-cni:v2.8.0
        command: 
        - /bin/sh
        - -c
        - |
          echo "Installing SR-IOV CNI for x86_64"
          # Use the proper entrypoint script
          ./entrypoint.sh --cni-bin-dir=/opt/cni/bin --sriov-bin-file=/usr/bin/sriov --no-sleep
          echo "SR-IOV CNI binary installed for x86_64"
          ls -la /opt/cni/bin/sriov
        securityContext:
          privileged: true
        volumeMounts:
        - name: cni-bin-dir
          mountPath: /opt/cni/bin
        resources:
          requests:
            cpu: "100m"
            memory: "50Mi"
          limits:
            cpu: "100m"
            memory: "50Mi"
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "50m"
            memory: "25Mi"
          limits:
            cpu: "50m"
            memory: "25Mi"
      volumes:
      - name: cni-bin-dir
        hostPath:
          path: /opt/cni/bin