{{ $base_port := (.Values.f5cneproxy.service.port | int )}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cneproxy.servicename" . }}
  labels:
    app:  {{ include "cneproxy.name" . }}
spec:
  ports:
  - name: f5-cne-proxy-https
    port: {{ $base_port }}
    protocol: TCP
    targetPort: {{ $base_port }}
  - name: f5-cne-proxy-qkview
    protocol: TCP
    port: 40001
    targetPort: 40001
  selector:
    app:  {{ include "cneproxy.name" . }}
