          exec:
            command:
              - "/bin/grpc_health_probe"
              - "-addr=:8084"
              - "-tls"
              - "-tls-ca-cert=$(TLS_OBSERVER_CA_FILE)"
              - "-tls-client-cert=$(TLS_OBSERVER_CERT_FILE)"
              - "-tls-client-key=$(TLS_OBSERVER_KEY_FILE)"
              - "-tls-server-name=$(OBSEVER_DNS)"
              - "-connect-timeout=4s"
          initialDelaySeconds: 5
          failureThreshold: 3
          periodSeconds: 10
          timeoutSeconds: 5
