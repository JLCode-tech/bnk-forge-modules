{{- if .Values.tmm.rbac.create }}
{{- if .Values.enabled }}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "tmm.name" . }}  
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tmm.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - list
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
{{- if .Values.global.stats }}
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
{{- end}} 
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "tmm.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tmm.labels" . | nindent 4 }}
roleRef:
  kind: Role
  name: {{ include "tmm.name" . }}
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: {{ include "tmm.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
