{{- if .Values.fluentbit.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: f5-toda-fluentbit-config
  labels:
    k8s-app: fluent-bit
data:
  # Configuration files: server, input, filters and output
  # ======================================================
  fluent-bit.conf: |
    [SERVICE]
        Flush         {{ .Values.fluentbit.flush }}
        Log_Level     {{ .Values.fluentbit.logLevel }}
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   off
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Storage.Path  /fluent-bit/storage

    @INCLUDE input.conf
    {{- if eq .Values.fluentbit.type "generic" }}
    @INCLUDE filter-k8s.conf
    @INCLUDE output-fluentd.conf
    {{- else }}
    @INCLUDE filter-base.conf
    @INCLUDE output-stdout.conf
    {{- end }}

  input.conf: |
    [INPUT]
        Name              named_pipe
        Tag               kube.f5.log
        Path              /var/log/f5/*/*.pipe
        Path_Key          path
        # Parser            docker
        buf_size          {{ .Values.fluentbit.input.pipes.bufSize }}
        interval_sec      {{ .Values.fluentbit.input.pipes.intervalSec }}
        interval_nsec     {{ .Values.fluentbit.input.pipes.intervalNsec }}

  filter-k8s.conf: |
    [FILTER]
        Name    record_modifier
        Match   kube.f5.log
        Record  namespace ${NAMESPACE}
        Record  node ${NODE}
        Record  pod ${POD}
        Record  pod_id ${POD_ID}
    
    [FILTER]
        Name          parser
        Match         kube.f5.log
        Key_Name      pod
        Parser        podname
        Preserve_Key  True
        Reserve_Data  True
    
    [FILTER]
        Name          parser
        Match         kube.f5.log
        Key_Name      path
        Parser        observerpipe
        Parser        debugpipe
        Parser        filename
        Parser        tmm
        Reserve_Data  True

    # if no service, add it
    [FILTER]
        Name          modify
        Match         kube.f5.log
        Add           service f5-fsm-tmm

  filter-base.conf: |  
    [FILTER]
        Name          parser
        Match         kube.f5.log
        Key_Name      path
        Parser        type
        Reserve_Data  True

  output-stdout.conf: |
    [OUTPUT]
        Name            stdout
        Match           kube.f5.log
  
{{- if eq .Values.fluentbit.type "generic" }}
  output-fluentd.conf: |
    [OUTPUT]
        Name          forward
        Match         kube.f5.*
        Host          {{ required "f5-tmm.fluentbit.fluentd.host is required" .Values.fluentbit.fluentd.host }}
        Port          {{ .Values.fluentbit.fluentd.port | default 54321 }}
        Retry_Limit   30
        {{- if .Values.fluentbit.tls.enabled }}
        tls               On
        tls.debug         {{ .Values.fluentbit.tls.debug }}
        tls.verify        {{ .Values.fluentbit.tls.verify }}
        tls.ca_file       /tls/genericfluentbit/tcp/clt/ca.crt
        tls.crt_file      /tls/genericfluentbit/tcp/clt/tls.crt
        tls.key_file      /tls/genericfluentbit/tcp/clt/tls.key
        Shared_Key        {{ .Values.fluentbit.tls.shared_key }}
        {{- end }}
{{- end }}

  parsers.conf: |
    [PARSER]
        Name   json
        Format json
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name filename
        Format regex
        # to parse '/var/log/f5/f5-fsm-tmm_f5.tmm.side-7dd454bc74-vqn8h_stdout.pipe'
        # Regex \/(?<service>[^\/_]+)_(?<hostname>[^_]+)_(?<type>(stdout|stderr)).pipe$
        Regex \/(?<service>[^\/_]+)_[^_]+_(?<type>(stdout|stderr)).pipe$

    [PARSER]
        Name tmm
        Format regex
        # to parse '/var/log/tmm/tmm23.pipe'
        Regex \/(?<type>tmm[0-9]+).pipe$
    
    [PARSER]
        Name observerpipe
        Format regex
        Regex \/(?<service>observer)\.pipe$
        
    [PARSER]
        Name debugpipe
        Format regex
        Regex \/(?<service>debug_api)\.pipe$

    [PARSER]
        Name podname
        Format regex
        # to parse 'tmp-tmm-example-75cc78f9c6-tgr5b'
        Regex (?<pod_name>.+)-[a-z0-9]{9,10}-[a-z0-9]{5}$
    
    [PARSER]
        Name type
        Format regex
        # to parse '/var/log/f5/f5-fsm-tmm_f5.tmm.side-7dd454bc74-vqn8h_stdout.pipe'
        # and to parse '/var/log/tmm/tmm23.pipe'
        Regex (_|\/)(?<type>(stdout|stderr|tmm[0-9]+)).pipe$
{{- end -}}
