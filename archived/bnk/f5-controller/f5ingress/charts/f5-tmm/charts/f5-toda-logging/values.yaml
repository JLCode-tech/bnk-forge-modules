# certKey volume mount for tmstats
certKeyVolumeMount:
  - name: ca-pemstore
    mountPath: /etc/ssl/certs/ca_root.crt
    readOnly: true
    subPath: ca_root.crt
  - name: certs-volume
    mountPath: /etc/ssl/certs/grpc-otel-client.crt
    readOnly: true
    subPath: grpc-otel-client.crt
  - name: keys-volume
    mountPath: /etc/ssl/private/grpc-otel-client.key
    readOnly: true
    subPath: grpc-otel-client.key

# certOrchestrator volume mount for tmstats
certOrchestratorVolumeMount:
  - name: tls-tmstatsd-grpc-clt-volume
    mountPath: /tls/tmstatsd/grpc/clt/
    readOnly: true

# robin platform corefile volume mount for tmstats
robinCorefileVolumeMount:
  - name: f5-core-store
    mountPath: /var/crash
    readOnly: false

# certOrchestratorQkviewVolumeMount  for tmstats to trigger qkview with cert-manager
certOrchestratorQkviewVolumeMount:
  - name: tls-toda-logging-grpc-svr-volume
    mountPath: /tls/toda-logging/grpc/svr/
    readOnly: true

# withOutCertOrchestratorQkviewVolumeMount  for tmstats to trigger qkview without cert-manager
withoutCertOrchestratorQkviewVolumeMount:
  - name: qkview-server-ca-cert
    mountPath: /etc/ssl/certs/ca-root-cert.pem
    subPath: ca-root-cert.pem
  - name: qkview-server-cert
    mountPath: /etc/ssl/certs/server-cert.pem
    subPath: server-cert.pem
  - name: qkview-server-keys
    mountPath: /etc/ssl/certs/server-key.pem
    subPath: server-key.pem

# certOrchestratorQkviewVolume  for tmstats to trigger qkview with cert-manager
certOrchestratorQkviewVolume:
  - name: tls-toda-logging-grpc-svr-volume
    secret:
      secretName: tls-toda-logging-grpc-svr-secret

# withOutCertOrchestratorWithoutQkviewVolume for tmstats to trigger qkview without cert-manager
withoutCertOrchestratorWithoutQkviewVolume:
  - name: qkview-server-ca-cert
    secret:
      secretName: qkview-server-certs
  - name: qkview-server-cert
    secret:
      secretName: qkview-server-certs
  - name: qkview-server-keys
    secret:
      secretName: qkview-server-certs

qkviewMount:
  env:
    - name: QK_GRPC_PORT
      value: "19891"
    - name: QK_TLS_CA_BUNDLE
      value: "/etc/ssl/certs/ca-root-cert.pem"
    - name: QK_TLS_CERT_FILE
      value: "/etc/ssl/certs/server-cert.pem"
    - name: QK_TLS_KEY_FILE
      value: "/etc/ssl/certs/server-key.pem"
    - name: QK_TLS_CERT_RETRY_WAIT
      value: "5s"
    - name: CONTAINER_NAME
      value: "toda-logging"
