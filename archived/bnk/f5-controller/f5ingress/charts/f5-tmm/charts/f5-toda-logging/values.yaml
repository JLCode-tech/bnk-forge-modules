            },
            {
              "name": "interface_stat",
              "columns": [
                "name",
                "if_index",
                "counters.pkts_in",
                "counters.bytes_in",
                "counters.pkts_out",
                "counters.bytes_out",
                "counters.errors_in",
                "counters.errors_out",
                "counters.drops_in",
                "counters.drops_out",
                "counters.collisions",
                "resets",
                "rx_pkts",
                "tx_pkts",
                "tx_lost_carrier",
                "rx_hw_drop",
                "tx_hw_drop"
              ]
            },
            {
              "name": "ip_intelligence_stat",
              "row_name": "context_type&context_name&category",
              "disableRowNameInMetricName": true,
