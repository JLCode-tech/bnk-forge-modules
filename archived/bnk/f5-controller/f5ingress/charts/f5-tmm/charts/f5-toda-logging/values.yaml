global:
  certmgr:
    external: false
  stats:
    enabled: true
    ## If using an external cert-manager installation, the issuerRef must be populated with the required fields.
    # issuerRef:
    #   name: cert-issuer
    #   kind: Issuer
    #   group: cert-manager.io

# If true, logging config injection happens. otherwise yamls are original.
enabled: true

volumeTmstat:
  - name: f5tmstat-config
    configMap:
      name: f5-tmstatsd
  - name: shared-dir
    emptyDir: {}

volumeMountCoreTmstat:
  - name: f5-core-store
    mountPath: /var/crash
    readOnly: false

# Tmstats is a sidecar which is injected to tmm container
tmstats:
  enabled: false
  f5_csm_qkview:
    enabled: true
    grpc_port: 19891
  cert_manager:
    enabled: true
  config:
    name: f5-toda-tmstats
    image:
      name: f5-toda-tmstatsd
      tag: v1.11.19-0.0.3
    ports:
      - containerPort: 19891
        name: grpc-port
        protocol: TCP
    imagePullPolicy: IfNotPresent
    env:
      - name: NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: OTEL_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: PLATFORM_USED
        value: spk
      - name: USING_CERT_ORCHESTRATOR
        value: "true"
      - name: RETRY_ATTEMPTS_TO_OTEL
        value: "6"
      - name: LOG_LEVEL
        value: INFO
      - name: OTEL_READ_INTERVAL_MS
        value: "500"
    volumeMounts:
      - name: f5tmstat
        mountPath: /var/tmstat
        readOnly: true
      - name: f5tmstat-config
        mountPath: /etc/tmstat_config
        readOnly: true
      - name: shared-dir
        mountPath: /tmp
        subPath: tmp
      - name: shared-dir
        mountPath: /run
        subPath: run
      - name: shared-dir
        mountPath: /stats
        subPath: stats
    resources:
      limits:
        cpu: 700m
        memory: 1Gi
      requests:
        cpu: 700m
        memory: 1Gi
    securityContext:
      privileged: false
      runAsNonRoot: true
      runAsUser: 20000
      runAsGroup: 30000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
  tableConfig: |
    {
      "input": {
        "directory": "/var/tmstat/blade",
        "extract_timeout": 30,
        "per_tmm_thread": false
      },
      "output": {
        "otel": {
          "ip": "localhost",
          "port": 4317,
          "certificate_file": "/tls/tmstatsd/grpc/clt/tls.crt",
          "key_file": "/tls/tmstatsd/grpc/clt/tls.key",
          "ca_file": "/tls/tmstatsd/grpc/clt/ca.crt",
          "server_name": "otel-collector",
          "tmm_stat_tables": [
            {
              "name": "tmm_stat",
              "row_name": "cpu",
              "columns": [
                "tot_tmms",
                "cpu",
                "cpu_usage_15mins",
                "cpu_usage_5mins",
                "cpu_usage_1min",
                "cpu_usage_15secs",
                "cpu_usage_5secs",
                "cpu_usage_1sec",
                "memory_used",
                "memory_total",
                "dropped_packets",
                "server_side_traffic.bytes_out",
                "server_side_traffic.bytes_in",
                "server_side_traffic.pkts_out",
                "server_side_traffic.pkts_in",
                "server_side_traffic.cur_conns",
                "server_side_traffic.max_conns",
                "client_side_traffic.bytes_out",
                "client_side_traffic.bytes_in",
                "client_side_traffic.pkts_out",
                "client_side_traffic.pkts_in",
                "client_side_traffic.cur_conns",
                "client_side_traffic.max_conns"
