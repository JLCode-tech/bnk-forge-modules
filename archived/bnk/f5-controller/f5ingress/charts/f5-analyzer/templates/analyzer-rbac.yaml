
{{- if and .Values.analyzer.enabled .Values.analyzer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "analyzer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}

---

{{- if .Values.analyzer.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterrole-{{ include "analyzer.roleName" . }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "update"]
  - apiGroups: ["gateway.k8s.f5net.com"]
    resources: ["l4routes"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
{{- end }}
---
{{- if .Values.analyzer.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusterrolebinding-{{ include "analyzer.roleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "analyzer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: clusterrole-{{ include "analyzer.roleName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}