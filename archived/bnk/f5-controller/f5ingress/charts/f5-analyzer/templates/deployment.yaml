{{- if .Values.analyzer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.image.name }}"
  namespace: {{ .Release.Namespace }} 
  labels:
    name: "{{ .Values.image.name }}"
spec:
  selector:
    matchLabels:
      name: "{{ .Values.image.name }}"
      run: {{ .Values.analyzer.name }}
  template:
    metadata:
      {{- if .Values.pod.annotations }}
      annotations:
        {{ toYaml .Values.pod.annotations | nindent 8 }}
      {{- end }}
      labels:
        name: "{{ .Values.image.name }}"
        run: {{ .Values.analyzer.name }}
    spec:
      serviceAccountName: {{ include "analyzer.serviceAccountName" . }}
      imagePullSecrets:
        - name: {{ .Values.imageCredentials.name }}
      {{- if .Values.affinity }}
      affinity:
        {{ toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.image.name }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          readinessProbe:
            tcpSocket:
              port: 28888
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 28888
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 28888
            failureThreshold: 5
            periodSeconds: 30
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: ANALYZER_GRPC_PORT
              value: "{{ .Values.analyzer.grpc.port }}"
            - name: LOG_LEVEL
              value: "{{ .Values.logLevel }}"
          volumeMounts:
          - name: tls-analyzer-grpc-svr-volume
            mountPath: /tls/analyzer/grpc/svr
            readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: tls-analyzer-grpc-svr-volume
        secret:
          secretName: tls-analyzer-grpc-svr-secret
{{- end }}