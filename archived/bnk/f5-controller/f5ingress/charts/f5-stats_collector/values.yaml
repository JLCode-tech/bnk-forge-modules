enabled: false

## The node selector for pod assignment for the OTEL pods.
nodeSelector: {}

## The tolerations of the OTEL pods.
tolerations: []

## The affinity of the OTEL pods.
affinity: {}

pod:
  annotations: {}

extra:
  volumes: []
  volumeMounts: []

image:
  name: opentelemetry-collector-contrib
  tag: 0.126.0
  pullPolicy: Always

## OTEL pods resources.
resources:
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "0.5"
    memory: "256Mi"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
        tls:
          client_ca_file: /tls/otel/grpc/svr/ca.crt
          cert_file: /tls/otel/grpc/svr/tls.crt
          key_file: /tls/otel/grpc/svr/tls.key
          reload_interval: 30s

exporters:
  prometheus:
    namespace: f5-tmm
    tls:
      client_ca_file: /external/otelsvr/ca.crt
      cert_file: /external/otelsvr/tls.crt
      key_file: /external/otelsvr/tls.key
      reload_interval: 30s

# below params can be used as global.serviceAccount.name
# uncomment name field
# set service account name: some-service-account-name
global:
  certmgr:
    external: false
    ## If using an external cert-manager installation, the issuerRef must be populated with the required fields. Please refer to cert-manager CRD schema.
    # issuerRef:
    #   name: cert-issuer
    #   kind: Issuer
    #   group: cert-manager.io

  # The name of the secret containing docker registry credentials.
  # Optional
  # imageCredentials:
  #   name: f5ingress-regsecret

service:
  pipelines:
    metrics:
      exporters: [prometheus]

spk-common:
  skipF5logCreation: true
