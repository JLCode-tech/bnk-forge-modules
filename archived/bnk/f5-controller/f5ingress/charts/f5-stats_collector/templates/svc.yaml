{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-svc
  labels:
    app: opentelemetry
    component: otel-collector
spec:
  selector:
    app: opentelemetry
  ports:
    - name: otlp-grpc # Default endpoint for OpenTelemetry gRPC receiver.
      port: 4317
      protocol: TCP
      targetPort: 4317
    - name: otlp-prometheus
      port: 9090
      protocol: TCP
      targetPort: 9090
  type: ClusterIP
{{- end }}