---
#certificate for communication from CWC Orchestrator to Qkview process
{{- if .Values.dwbld.f5_csm_qkview.enabled }}
{{- if .Values.global.certmgr.external }}
apiVersion: cert-manager.io/v1
{{- else }}
apiVersion: cm.f5co.k8s.f5net.com/v1
{{- end }}
