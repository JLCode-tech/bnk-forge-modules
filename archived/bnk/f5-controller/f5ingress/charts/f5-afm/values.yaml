

global:
  imageCredentials:
    name: f5-afm-regsecret
  certmgr:
    external: false
    ## If using an external cert-manager installation, the issuerRef must be populated with the required fields.
    # issuerRef:
    #   name: cert-issuer
    #   kind: Issuer
    #   namespace: cert-manager


enabled: false
afm:
  name: f5-afm

  ## AFM pod assignment/selector values
  nodeSelector: {}
  tolerations: []
  affinity: {}

  ## Enables the AFM pods to use the host's network namespace.
  hostNetwork: false

  ## AFM annotations
  annotations: {}

  ## AFM pod security context
  podSecurityContext:
    ## fsGroup defines a file system group ID for all containers in the pod
    ## This ensures that volume mounts have the correct permissions
    fsGroup: 10000

  ## below params can be used as afm.serviceAccount.name
  serviceAccount:
    create: true
    ## The name of the service account to use.
    ## If not set and create is true, a name is generated using .Values.afm.name.
    # name: ""  


   
  blobd:
    grpc:
      name: grpc-blobd-svc
      # If this value is empty, then pccd sends blob directly to tmm
      port: 9222

  pccd:
    name: f5-afm-pccd
    enabled: false
    debug: false
    log_level: notice

    ## PCCD image values
    image:
      name: f5-l4p-engine
      tag: v1.127.13-0.0.5
      pullPolicy: IfNotPresent

    k8sprobes:
      enabled: true
      readinessProbe:
        initialDelaySeconds: 5
        periodSeconds: 1
      livenessProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
    
    ## PCCD security values
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsUser: 10000

    ## PCCD resources
    resources:
      limits:
        cpu: "1"
        memory: "512Mi"
      requests:
        cpu: "0.5"

    ## PCCD env values
    blob:
      maxFwBlobSizeMb: "512"
      maxNatBlobSizeMb: "512"

    config:
      name: f5-afm-pccd-config
      entries: {}

    grpc:
      name: grpc-pccd-svc
      port: 8750
    
    f5_csm_qkview:
      enabled: true
      grpc_port: 19894

  ## Fluentbit sidecar values
  fluentbit_sidecar:
    # Enable/Disable sidecar
    enabled: true
    name: fluentbit
    # Redirect logs to stdout
    debug: true
    # Image container definition
    image:
        name: f5-fluentbit
        tag: v1.2.8-0.0.5
        pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: "0.5"
        memory: "512Mi"
      requests:
        cpu: "0.25"
        memory: "256Mi"

    ## securityContext for Fluentbit sidecar
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsUser: 10000
    fluentbit:
      # Interval to flush output (seconds)
      flush_interval: 1
      # Error/warning/info/debug/trace
      logLevel: info
      # Pipe reading parameters
      input:
        pipes:
          bufSize: 8096
          intervalSec: 1
          intervalNsec: 0
      tls:
        enabled: false
        # TLS debug verbosity level, values: 0 (No debug), 1 (Error), 2 (State change), 3 (Informational) and 4 (Verbose)
        debug: 1
        # Force certificate validation
        verify: Off
        # key string known by the remote Fluentd used for authorization.
        shared_key: f5-toda-shared-key
    fluentd:
      host: '127.0.0.1'
      port: 54321

spk-common:
  skipF5logCreation: true