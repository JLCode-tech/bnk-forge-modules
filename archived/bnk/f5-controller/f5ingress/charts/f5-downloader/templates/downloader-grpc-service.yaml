{{- if and .Values.enabled .Values.global.tmm.grpc.enabled }}
{{ $base_port := (.Values.global.downloader.grpc.port | int )}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.downloader.grpc.name }}
  labels:
    app: {{ .Values.downloader.name }}
    type: grpc
spec:
  selector:
    app: {{ .Values.downloader.name }}
  ports:
    - protocol: TCP
      name: grpc-downloader
      port: {{ $base_port }}
      targetPort: {{ $base_port }}
{{- end }}
---
{{- if (.Values.downloader.f5_csm_qkview.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: f5-downloader
  labels:
    app: {{ .Values.downloader.name }}
spec:
  clusterIP: "None"
  ports:
  - port: {{ .Values.downloader.f5_csm_qkview.grpc_port }}
    name: grpc-port-qkview
    protocol: TCP
    targetPort: {{ .Values.downloader.f5_csm_qkview.grpc_port }}
  selector:
    app: {{ .Values.downloader.name }}
{{- end }}