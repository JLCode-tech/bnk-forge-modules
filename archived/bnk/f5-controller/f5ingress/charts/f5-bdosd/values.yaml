
enabled: false

bdosd:
  name: f5-bdosd
  enabled: false
  debug: false

  f5_csm_qkview:
    enabled: true
    grpc_port: 19891

  ## BDOSD pod assignment/selector values.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  ## Enables the BDOSD pods to use the host's network namespace.
  hostNetwork: false

  ## BDOSD annotations
  annotations: {}

  ## BDOSD image values
  image:
    name: f5-bdosd
    tag: v0.72.0-0.1.3
    pullPolicy: IfNotPresent

  ## BDOSD security values
  securityContext:
    readOnlyRootFilesystem: true

  ## BDOSD resources
  resources:
    limits:
      cpu: "1"
      memory: "512Mi"
    requests:
      cpu: "0.5"
      memory: "256Mi"

  ## BDOSD ConfigMap values
  config:
    name: f5-bdosd-config
    entries: {}

  ## BDOSD GRPC values
  grpc:
    name: grpc-bdosd-svc
    port: 8750
    ca: "ca_root.crt"
    cert: "grpc-svc.crt"
    key: "grpc-svc.key"
    client_ca: "ca_root.crt"
    client_cert: "grpc-bdosd-client.crt"
    client_key: "grpc-bdosd-client.key"

  ## Fluentbit sidecar values
  fluentbit_sidecar:
    # Enable/Disable sidecar
    enabled: false
    name: fluentbit
    # Image container definition
    image:
        name: f5-fluentbit
        tag: v1.2.8-0.0.5
        pullPolicy: IfNotPresent
    # Environment variables used in config file for fluentbit
    env:
      - name: NODE
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: POD_ID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: POD
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    volumeMounts:
      - name: tmp
        mountPath: /tmp
        readOnly: false
      - name: run-dir
        mountPath: /run
        readOnly: false
      - name: logs-dir
        mountPath: /logs
        readOnly: false
      - name: f5-log-pipes
        mountPath: /var/run/f5
        readOnly: true
      - name: f5-bdosd-fluentbit-config
        mountPath: /fluent-bit/etc/
    volumeMountsTls:
      - name: f5-bdosd-fluentbit-secrets
        mountPath: /fluent-bit/ssl/
    fluentbit:
      # Interval to flush output (seconds)
      flush_interval: 1
      # Error/warning/info/debug/trace
      logLevel: info
      # Pipe reading parameters
      input:
        pipes:
          bufSize: 8096
          intervalSec: 1
          intervalNsec: 0
      tls:
        enabled: false
        # TLS debug verbosity level, values: 0 (No debug), 1 (Error), 2 (State change), 3 (Informational) and 4 (Verbose)
        debug: 1
        # Force certificate validation
        verify: Off
        # key string known by the remote Fluentd used for authorization.
        shared_key: f5-toda-shared-key

    fluentd:
      host: '127.0.0.1'
      port: 54321

##
## Global params which are being used by more than one pod.
##
# below params can be used as gobal.serviceAccount.name
global:
## enum for identifying platform type. By default it is set to other. User needs to define the platform type (ocp,robin,tanzu,mbip-ve) during deployment.
  platformType: other
  serviceAccount:
    name:
    create: false
  certmgr:
    external: false
    ## If using an external cert-manager installation, the issuerRef must be populated with the required fields.
    # issuerRef:
    #   name: cert-issuer
    #   kind: Issuer
    #   namespace: cert-manager

# The below global variables are being used by bdosd, afm and downloader subcharts only.

  controller:
    Only: false
    crdupdater:
      enabled: false
      grpc:
        port: 8750
  imageCredentials:
    name: f5ingress-regsecret
  tmm:
    grpc:
      enabled: true
      name: grpc-svc
  blobd:
    enabled: false
    grpc:
      port: 9222
  afm:
    enabled: false
    pccd:
      enabled: false
      grpc:
        name: grpc-pccd-svc
### BDOSD GRPC values
  bdosd:
## when applianceMode is set to true tmm tmstat is mounted on hostpath for bdosd
    applianceMode:
      enabled: false
    grpc:
      name: grpc-bdosd-svc
      port: 8750
      ca: "ca_root.crt"
      cert: "grpc-svc.crt"
      key: "grpc-svc.key"
      client_ca: "ca_root.crt"
      client_cert: "grpc-bdosd-client.crt"
      client_key: "grpc-bdosd-client.key"
fluentbit:
  mainFile: |
    [SERVICE]
        Flush         {{ .Values.bdosd.fluentbit_sidecar.fluentbit.flush_interval }}
        Log_Level     {{ .Values.bdosd.fluentbit_sidecar.fluentbit.logLevel }}
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   off
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    @INCLUDE input.conf
    @INCLUDE filter-k8s.conf
    @INCLUDE output-fluentd.conf
    {{- if .Values.bdosd.fluentbit_sidecar.debug }}
    @INCLUDE output-stdout.conf
    {{- end }}

  mainAddFiles: |
    input.conf: |-
      [INPUT]
          Name              named_pipe
          Tag               kube.f5.bdosd.log
          Path              /var/run/f5/*.pipe
          Path_Key          path
          buf_size          {{ .Values.bdosd.fluentbit_sidecar.fluentbit.input.pipes.bufSize }}
          interval_sec      {{ .Values.bdosd.fluentbit_sidecar.fluentbit.input.pipes.intervalSec }}
          interval_nsec     {{ .Values.bdosd.fluentbit_sidecar.fluentbit.input.pipes.intervalNsec }}

    filter-k8s.conf: |-
      [FILTER]
          Name    record_modifier
          Match   kube.f5.bdosd.log
          Record  namespace ${NAMESPACE}
          Record  node ${NODE}
          Record  pod ${POD}
          Record  pod_id ${POD_ID}
          Record  service bdosd

      [FILTER]
          Name          parser
          Match         kube.f5.bdosd.log
          Key_Name      pod
          Parser        podname
          Preserve_Key  True
          Reserve_Data  True

      [FILTER]
          Name          parser
          Match         kube.f5.bdosd.log
          Key_Name      path
          Parser        logtype
          Reserve_Data  True

    output-stdout.conf: |-
      [OUTPUT]
          Name            stdout
          Match           kube.f5.bdosd.log

    output-fluentd.conf: |-
      [OUTPUT]
          Name          forward
          Match         kube.f5.*
          Host          {{ .Values.bdosd.fluentbit_sidecar.fluentd.host }}
          Port          {{ .Values.bdosd.fluentbit_sidecar.fluentd.port | default 54321 }}
          {{- if .Values.bdosd.fluentbit_sidecar.fluentbit.tls.enabled }}
          tls               On
          tls.debug         {{ .Values.bdosd.fluentbit_sidecar.fluentbit.tls.debug }}
          tls.verify        {{ .Values.bdosd.fluentbit_sidecar.fluentbit.tls.verify }}
          tls.ca_file       /tls/bdosdfluentbit/grpc/clt/ca.crt
          tls.crt_file      /tls/bdosdfluentbit/grpc/clt/tls.crt
          tls.key_file      /tls/bdosdfluentbit/grpc/clt/tls.key
          Shared_Key        {{ .Values.bdosd.fluentbit_sidecar.fluentbit.tls.shared_key }}
          {{- end }}

    parsers.conf: |-
      [PARSER]
          Name        docker
          Format      json
          Time_Key    time
          Time_Format %Y-%m-%dT%H:%M:%S.%L
          Time_Keep   On

      [PARSER]
          Name logtype
          Format regex
          Regex [^(stdout|stderr)]+(?<type>(stdout|stderr)).pipe$

      [PARSER]
          Name podname
          Format regex
          Regex (?<pod_name>.+)-[a-z0-9]{9,10}-[a-z0-9]{5}$
