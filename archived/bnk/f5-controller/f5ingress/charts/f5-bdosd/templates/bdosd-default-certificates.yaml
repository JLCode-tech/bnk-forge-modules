---
{{- if .Values.global.certmgr.external }}
apiVersion: cert-manager.io/v1
{{- else }}
apiVersion: cm.f5co.k8s.f5net.com/v1
{{- end }}
kind: Certificate
metadata:
  name: tls-bdosdfluentbit-grpc-clt
