f5-stats_collector:
  spk-common:
    skipF5logCreation: true
  enabled: false
  image:
    name: opentelemetry-collector-contrib
    tag: 0.123.0
    pullPolicy: Always

  ## OTEL pod configuration
  ## The node selector for pod assignment for the OTEL pod.
  nodeSelector: {}

  ## The tolerations of the OTEL pod.
  tolerations: []

  ## The affinity of the OTEL pod.
  affinity: {}
  ## pod resources.
  resources:
    limits:
      cpu: "1"
      memory: "512Mi"
    requests:
      cpu: "0.5"
      memory: "256Mi"

##
## Global params which are being used by more than one pod.
##
# below params can be used as gobal.serviceAccount.name
global:
  serviceAccount:
    name:
    create: false
  certmgr:
    external: false
    ## If using an external cert-manager installation, the issuerRef must be populated with the required fields.
    # issuerRef:
    #   name: cert-issuer
    #   kind: Issuer
    #   group: cert-manager.io
  
  tmmDefaultMTU: 1500

## enum for identifying platform type. By default it is set to none. User need to define the platform type (ocp,robin,tanzu) while deployment.
  platformType: other

  ## enum for identifying asymmetric ddos type. By default it is NIL.
  ## User needs to define this while deployment if asymmetric mode is desired.
  ## Supported values are asym_ddos_mode_normal, asym_ddos_mode_sw_eval.
  ##
  ##       When set to 'asym_ddos_mode_normal', asymmetric functionalities are
  ##       enabled for the packet processing both in SW and HW.
  ##
  ##       When set to 'asym_ddos_mode_sw_eval', traffic is replicated to host
  ##       as per the configured pktMeteringRate. In this mode, asymmetric
  ##       functionalities can be verified and stats/logs can be seen, but all
  ##       the packets be dropped. It should be used when in port mirror or
  ##       out-of-path mode. This is meant to be enabled for evaluation purpose.
  ##
  #asymmetricDosMode: asym_ddos_mode_normal

# The below global variables are being used by tmm, ipsd, afm and downloader subcharts only.

  controller:
    Only: false
    crdupdater:
      enabled: false
      grpc:
        port: 8750
  # The name of the secret containing docker registry credentials.
  # Optional
  # imageCredentials:
  #   name: f5ingress-regsecret
  tmm:
    grpc:
      enabled: true
      name: grpc-svc
  blobd:
    enabled: true
    grpc:
      port: 9222
  afm:
    enabled: false
    shared_volume_size: 2Gi
    pccd:
      enabled: false
      grpc:
        name: grpc-pccd-svc
    serviceAccount:
      create: true
      name: afm-sa
    rbac:
      create: true

### DNS Express
  dnsx:
    enabled: false
    name: f5-zxfrd
    # Uses "<dnsx.name>.<dnsx.grpc.name>.<namespace>.svc.cluster.local" if not set
    hostname:

    ## DNSX GRPC values
    grpc:
      name: grpc-dnsx-svc
      port: 8750

    ## DNSX tmstat values
    tmstat:
      enabled: true

### SNIC-Mgr GRPC values
  snicmgr:
    enabled: false
    grpc:
      name: grpc-snic-mgr-svc
      port: 8750
      ca: "ca_root.crt"
      cert: "grpc-svc.crt"
      key: "grpc-svc.key"
      client_ca: "ca_root.crt"
      client_cert: "grpc-snic-mgr-client.crt"
      client_key: "grpc-snic-mgr-client.key"

### SNIC-Lacpd GRPC values
  lacpd:
    enabled: false
    grpc:
      name: grpc-snic-lacpd-svc
      port: 8750

### BDOSD GRPC values
  bdosd:
    enabled: false
    applianceMode:
      enabled: false
    grpc:
      name: grpc-bdosd-svc
      port: 8750
      ca: "ca_root.crt"
      cert: "grpc-svc.crt"
      key: "grpc-svc.key"
      client_ca: "ca_root.crt"
      client_cert: "grpc-bdosd-client.crt"
      client_key: "grpc-bdosd-client.key"

### Gslb
  gslb:
    enabled: false
    tmstat:
      enabled: false
    vault:
      roleName: f5ingress-grpc-clt
      port: 8200
      vaultHost: f5-eesv-vault

### F5 CNE-proxy
  f5cneproxy:
    enabled: false

### IPSD GRPC values
  ipsd:
    grpc:
      name: grpc-ipsd-svc
      port: 8750
      ca: "ca_root.crt"
      cert: "grpc-svc.crt"
      key: "grpc-svc.key"
      client_ca: "ca_root.crt"
      client_cert: "grpc-ipsd-client.crt"
      client_key: "grpc-ipsd-client.key"
### DWBLD GRPC values
  dwbld:
    enabled: false
    grpc:
      name: grpc-dwbld-svc
      port: 8750
      ca: "ca_root.crt"
      cert: "grpc-svc.crt"
      key: "grpc-svc.key"
      client_ca: "ca_root.crt"
      client_cert: "grpc-dwbld-client.crt"
      client_key: "grpc-dwbld-client.key"

### Downloader GRPC values
  downloader:
    grpc:
      name: grpc-downloader-svc
      port: 8750
      ca: "ca_root.crt"
      cert: "grpc-svc.crt"
      key: "grpc-svc.key"
      client_ca: "ca_root.crt"
      client_cert: "grpc-downloader-client.crt"
      client_key: "grpc-downloader-client.key"

f5_fqdn_resolver:
  name: f5-fqdn-resolver
  port: 8443
  enabled: false
  debugLevel: 0
  f5_csm_qkview:
    enabled: true
    grpc_port: 40001
  nameserver:
  annotations:
  image:
    name: f5-fqdn-resolver
    tag: v0.8.1-0.0.3
    pullPolicy: IfNotPresent

  ## resolver resource values
  resources:
    limits:
      cpu: "0.5"
      memory: "512Mi"
    requests:
      cpu: "0.25"
      memory: "256Mi"

  fluentbit_sidecar:
    # Enable/Disable sidecar
    enabled: false
    name: fluentbit
    # Image container definition
    image:
        name: f5-fluentbit
        tag: v1.2.8-0.0.5
        pullPolicy: IfNotPresent

    ## sidecar resource values
    resources:
      limits:
        cpu: "0.5"
        memory: "512Mi"
      requests:
        cpu: "0.25"
        memory: "256Mi"
    # Environment variables used in config file for fluentbit
    env:
      - name: NODE
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: POD_ID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: POD
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    fluentbit:
      # Interval to flush output (seconds)
      flush_interval: 1
      # Error/warning/info/debug/trace
      logLevel: info
      # Pipe reading parameters
      input:
        pipes:
          bufSize: 2000
          intervalSec: 1
          intervalNsec: 0
      tls:
        enabled: false
        # TLS debug verbosity level, values: 0 (No debug), 1 (Error), 2 (State change), 3 (Informational) and 4 (Verbose)
        debug: 1
        # Force certificate validation
        verify: Off
        # key string known by the remote Fluentd used for authorization.
        shared_key: f5-toda-shared-key
    fluentd:
      host: f5-toda-fluentd
      port: 54321

# SPK common helm
f5-toda-observer:
  spk-common:
    skipF5logCreation: true

f5-bdosd:
  spk-common:
    skipF5logCreation: true

