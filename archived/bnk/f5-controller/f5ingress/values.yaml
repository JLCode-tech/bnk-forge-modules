##
## Ingress Controller Values
##
controller:
  Only: false

  ## The kind of the Ingress controller installation - deployment or daemonset.
  kind: deployment

  ## Enables the Ingress controller pods to use the host's network namespace.
  hostNetwork: false

  ## Maximum number of active ECMP targets per custom resource.
  ## default 0 - active ECMP targets = number of TMM pods.
  maxEcmpTarget: 0

  ## Enables debugging for F5Ingress.
  f5ingressDebug: false

  debug:
    port: 8080

  ## The log level of the Ingress Controller.
  logLevel: info

  ## Enables creation of LoadBalancer services for TMM, e.g. f5-tmm-tcp-service, f5-tmm-udp-service.
  createTmmLBService: true

  ## Enables Validation service for CNF.
  validationService:
    port: 5000
    sslCARootPath: /etc/ssl/validation/certs
    sslCACertName: ca_root.crt
    sslCertPath: /etc/ssl/validation/certs
    sslKeyPath: /etc/ssl/validation/private
    sslKeyName: validation-svc.key
    sslCertName: validation-svc.crt

  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsUser: 7053
    runAsGroup: 7053
    runAsNonRoot: true

  image:
    ## The image of the Ingress controller.
    name: f5ingress
    #tag: uses .Chart.AppVersion

    ## The pull policy for the Ingress controller image.
    pullPolicy: IfNotPresent

  config:
    ## The name of the ConfigMap used by the Ingress controller.
    ## Autogenerated if not set or set to "".
    name: f5ingress-config

    ## The entries of the ConfigMap for customizing configuration.
    entries: {}

  ## It is recommended to use your own TLS certificates and keys
  defaultTLS:
    ## The base64-encoded TLS certificate for the default HTTPS server. If not specified, a pre-generated self-signed certificate is used.
    ## Note: It is recommended that you specify your own certificate.
    cert: ""
    ## The base64-encoded TLS key for the default HTTPS server. Note: If not specified, a pre-generated key is used.
    ## Note: It is recommended that you specify your own key.
    key: ""
    ## The secret with a TLS certificate and key for the default HTTPS server.
    ## The value must follow the following format: `<namespace>/<name>`.
    ## Used as an alternative to specifying a certificate and key using `controller.defaultTLS.cert` and `controller.defaultTLS.key` parameters.
    secret: #<namespace>/<secret_name>

  wildcardTLS:
    ## The base64-encoded TLS certificate for every Ingress host that has TLS enabled but no secret specified.
    ## If the parameter is not set, for such Ingress hosts f5ingress will break any attempt to establish a TLS connection.
    cert: ""

    ## The base64-encoded TLS key for every Ingress host that has TLS enabled but no secret specified.
    ## If the parameter is not set, for such Ingress hosts f5ingress will break any attempt to establish a TLS connection.
    key: ""

    ## The secret with a TLS certificate and key for every Ingress host that has TLS enabled but no secret specified.
    ## The value must follow the following format: `<namespace>/<name>`.
    ## Used as an alternative to specifying a certificate and key using `controller.wildcardTLS.cert` and `controller.wildcardTLS.key` parameters.
    secret: #<namespace>/<secret_name>

  ## The node selector for pod assignment for the Ingress controller pods.
  nodeSelector: {}

  ## The termination grace period of the Ingress controller pod.
  terminationGracePeriodSeconds: 30

  ## The resources of the Ingress controller pods.
  resources:
    limits:
      cpu: 2
      memory: 1Gi
    requests:
      cpu: 0.5
      memory: 1Gi

  ## The tolerations of the Ingress controller pods.
  tolerations: []

  ## The affinity of the Ingress controller pods.
  affinity: {}

  ## The number of replicas of the Ingress controller deployment.
  replicaCount: 1

  ## Maximum number of active TMM.
  maxActiveReplicas: 32

  ## optional helm param mostly modified for troubleshooting purposes
  advanced:
    ## Kubernetes client QPS (queries per second) for the Ingress controller.
    k8sQPS: 50
    ## Kubernetes client burst for the Ingress controller.
    k8sBurst: 100

  ## A class of the Ingress controller. The Ingress controller only processes Ingress resources that belong to its class
  ## i.e. have the annotation "kubernetes.io/ingress.class" equal to the class.
  ## Additionally, the Ingress controller processes Ingress resources that do not have that annotation which can be disabled by setting the "-use-ingress-class-only" flag.
  ingressClass: f5ingress

  ## Ignore Ingress resources without the "kubernetes.io/ingress.class" annotation.
  useIngressClassOnly: false

  ## Namespace to watch for Ingress resources. By default the Ingress controller watches all namespaces.
  watchNamespace: ""

  ## flag to enable crashing of f5ingress
  crashFlag:
    enabled: false

  ## Egress snatpoool name
  egress:
    snatpoolName: "egress_snatpool"

  cwcNamespace: default
  cmNamespace: f5-certificate-orchestrator
  csrcNamespace: default

  ## Add a location based on the value of health-status-uri to the default server. The location responds with the 200 status code for any request.
  ## Useful for external health-checking of the Ingress controller.
  healthStatus: false

  ## Sets the URI of health status location in the default server. Requires contoller.healthStatus.
  healthStatusURI: "/f5ingress-health"
  f5ingressStatus:
    ## Enable the f5ingress stub_status
    enable: true

    ## Set the port where the f5ingress stub_status API is exposed.
    port: 8080

    ## Whitelist IPv4 IP/CIDR blocks to allow access to f5ingress stub_status. Separate multiple IP/CIDR by commas.
    allowCidrs: "127.0.0.1"

  serviceAccount:
    ## The name of the service account of the Ingress controller pods. Used for RBAC.
    ## Autogenerated if not set or set to "".
    # name: f5ingress

    ## The names of the secrets containing docker registry credentials.
    imagePullSecrets: []
      # - name: secret_name

  reportIngressStatus:
    ## Update the address field in the status of Ingresses resources with an external address of the Ingress controller.
    ## You must also specify the source of the external address either through an external service via controller.reportIngressStatus.externalService or the external-status-address entry in the ConfigMap via controller.config.entries.
    ## Note: controller.config.entries.external-status-address takes precedence if both are set.
    enable: true

    ## Enable Leader election to avoid multiple replicas of the controller reporting the status of Ingress resources. controller.reportIngressStatus.enable must be set to true.
    enableLeaderElection: true

  pod:
    ## The annotations of the Ingress Controller pod.
    annotations: {}

  report:
    interval: 300  # how often to publish report, in seconds

  command_ve:
    - "supervisord"
    - "-c"
    - "/etc/supervisor/conf.d/supervisord-ve.conf"
    - "-l"
    - "/tmp/supervisord.log"
  command_cnf:
    - "supervisord"
    - "-c"
    - "/etc/supervisor/conf.d/supervisord-cnf.conf"
    - "-l"
    - "/tmp/supervisord.log"

  ## Tmm pod manager sidecar values
  tmm_pod_manager:
    enabled: true
    name: f5-tmm-pod-manager
    image:
      name: f5ing-tmm-pod-manager
      tag: v1.0.18-0.0.7
      pullPolicy: IfNotPresent
    securityContext:
      runAsUser: 7053
      runAsGroup: 7053
      readOnlyRootFilesystem: true 
      runAsNonRoot: true     
    resources:
      limits:
        cpu: 0.5
        memory: 512Mi
      requests:
        cpu: 0.25
        memory: 256Mi
    grpc:
      name: grpc-pod-mgr-svc
      port: 8751
    f5_csm_qkview:
      enabled: true
      grpc_port: 40002

  ## csm-orchestrator (cwc sidecar) values
  f5_csm_qkview:
    enabled: true
    grpc:
      name: controller-qkview-grpc
      port: 19892

  ## Fluentbit sidecar values
  fluentbit_sidecar:
    # Enable/Disable sidecar
    enabled: true
    name: fluentbit
    # Redirect logs to stdout
    debug: true
    # Image container definition
    image:
        name: f5-fluentbit
        tag: v1.2.8-0.0.5
        pullPolicy: IfNotPresent
    securityContext:
      runAsUser: 7053
      runAsGroup: 7053
      runAsNonRoot: true
    ## sidecar values
    resources:
      limits:
        cpu: "0.5"
        memory: "512Mi"
      requests:
        cpu: "0.25"
        memory: "256Mi"
    # Environment variables used in config file for fluentbit
    env:
      - name: NODE
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: POD_ID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: POD
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    volumeMounts:
      - name: f5-log-pipes
        mountPath: /var/run/f5
        readOnly: true
      - name: f5-f5ingress-fluentbit-config
        mountPath: /fluent-bit/etc/
      - name: vol-mount-tmp
        mountPath: /tmp
        subPath: fluent-tmp
        readOnly: false
      - name: vol-mount-logs
        mountPath: /logs
        subPath: fluent-logs
        readOnly: false
      - name: vol-mount-run
        mountPath: /run
        subPath: fluent-run
        readOnly: false
    volumeMountsTls:
      - name: f5-f5ingress-fluentbit-secrets
        mountPath: /fluent-bit/ssl/
    fluentbit:
      # Interval to flush output (seconds)
      flush_interval: 1
      # Error/warning/info/debug/trace
      logLevel: info
      # Pipe reading parameters
      input:
        pipes:
          bufSize: 2000
          intervalSec: 1
          intervalNsec: 0
      tls:
        enabled: false
        # TLS debug verbosity level, values: 0 (No debug), 1 (Error), 2 (State change), 3 (Informational) and 4 (Verbose)
        debug: 1
        # Force certificate validation
        verify: Off
        # key string known by the remote Fluentd used for authorization.
        shared_key: f5-toda-shared-key

    fluentd:
      host: '127.0.0.1'
      port: 54321

    f5_csm_qkview:
      enabled: true
      grpc_port: 19883

  ## CRD Updater Values
  crdupdater:
    name: crdupdater
    debug: false
    log_level: notice

    f5_csm_qkview:
      grpc_port: 40001

    ## crdupdater image values
    image:
      name: crdupdater
      tag: v0.4.32-0.0.2
      pullPolicy: IfNotPresent

    k8sprobes:
      enabled: true
      livenessProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      readinessProbe:
        initialDelaySeconds: 5
        periodSeconds: 1


    ## updater resource values
    resources:
      limits:
        cpu: "0.5"
        memory: "512Mi"
      requests:
        cpu: "0.25"
        memory: "256Mi"
    ## crdupdater security values
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsUser: 7053
      runAsGroup: 7053
      runAsNonRoot: true

    ## crdupdater GRPC values
    grpc:
      port: 8752
      ca: "ca.crt"
      cert: "tls.crt"
      key: "tls.key"
      client_ca: "ca.crt"

  ##F5-LIC-HELPER sidecar values
  f5_lic_helper:
    enabled: false
    name: f5-lic-helper
    rabbitmqNamespace: "default"
    f5_csm_qkview:
      enabled: true
      grpc_port: 19891

    securityContext:
      runAsUser: 7053
      runAsGroup: 7053
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true

    ## license helper resource values
    resources:
      limits:
        cpu: "0.5"
        memory: "512Mi"
      requests:
        cpu: "0.25"
        memory: "256Mi"

    image:
      name: f5-license-helper
      tag: v0.12.10-0.0.4
      pullPolicy: IfNotPresent

# The name of the secret containing docker registry credentials.
# Optional
# imageCredentials:
#   name: f5ingress-regsecret

rbac:
  ## Configures RBAC.
  create: true

# Global Service Load Balancer (formerly known as gtmd)
gslbEngine:
  enabled: false
  name: f5-gslb-engine
  gslbEngineServerName: default
  instanceName:
  # Uses "<gslb.name>.<gslb.grpc.name>.<namespace>.svc.cluster.local" if not set
  hostname:
  image:
    name: gslb-engine
    tag: v0.111.15-0.0.2
    pullPolicy: Always
  command:
  start: true
  f5_csm_qkview:
    enabled: true
    grpc_port: 40001
  grpc:
    name: grpc-gslb-engine-svc
    port: 43530
    services:
      # SSL Names of gRPC Services which are servers for GSLB Engine.
      # Must match to DNS section of alt_names in their certificates.
      tmm: grpc-svc
      gslb_engine: grpc-gslb-engine-svc
      probe_agent: grpc-gslb-probe-agent-svc
  dssm:
    service: dssm-f5-dssm-db-0.dssm-f5-dssm-db
    port: 6379
    logLevel: error
    mountPath: /tls/gslb/dssm/clt
    cert: tls.crt
    key: tls.key
    caCert: ca.crt
  tmstat:
    ## GSLB tmstat values
    enabled: false
    storageClassName: robin
    accessMode: ReadWriteMany
    size: 1Gi
  config:
    name: f5-gslb-engine-config
    entries: {}
  ## A list of environment variables to add to the GSLB Engine Pod. Follows the conventional Kubernetes yaml syntax for environment variables
  customEnvVars: []

  securityContext:
    privileged: false
    runAsUser: 7053
    runAsGroup: 7053
    # GSLB Engine logging level to be set by environment variable at start.
    # Must contain prefixes: debug, info, notice, warn, err, crit, alert.
  logLevel: notice

  ## GSLB resources values
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "1"
      memory: "1Gi"

  ## Enabler of k8s probes for GSLB Engine container
  k8sprobes:
    enabled: true

  kubernetes_service_network: 10.43.0.0/16

  ## GSLB Engine Fluentbit sidecar values
  fluentbit_sidecar:
    # Enable/Disable sidecar
    enabled: false
    name: fluentbit
    # Image container definition
    image:
        name: f5-fluentbit
        tag: v1.2.8-0.0.5
        pullPolicy: IfNotPresent

    ## sidecar resource values
    resources:
      limits:
        cpu: "0.5"
        memory: "512Mi"
      requests:
        cpu: "0.25"
        memory: "256Mi"

    # Environment variables used in config file for fluentbit
    env:
      - name: NODE
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: POD_ID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: POD
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
    volumeMounts:
      - name: f5-log-pipes
        mountPath: /var/log/f5
        readOnly: true
      - name: f5-gslb-engine-fluentbit-config
        mountPath: /fluent-bit/etc/
    volumeMountsTls:
      - name: f5-gslb-engine-fluentbit-secrets
        mountPath: /fluent-bit/ssl/
    fluentbit:
      # Interval to flush output (seconds)
      flush_interval: 1
      # Error/warning/info/debug/trace
      logLevel: info
      # Pipe reading parameters
      input:
        pipes:
          bufSize: 2000
          intervalSec: 1
          intervalNsec: 0
      tls:
        enabled: false
        # TLS debug verbosity level, values: 0 (No debug), 1 (Error), 2 (State change), 3 (Informational) and 4 (Verbose)
        debug: 1
        # Force certificate validation
        verify: Off
        # key string known by the remote Fluentd used for authorization.
        shared_key: f5-toda-shared-key
    fluentd:
      host: '127.0.0.1'
      port: 54321

