# Check if the HTTP settings CRD is present in the cluster.
{{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "f5-big-http-settings.k8s.f5net.com") }}

apiVersion: k8s.f5net.com/v1
kind: F5BigHttpSetting
metadata:
  name: sys-default-http
spec:
  oneConnect: false
  responseChunking: "sustain"
  lwsMaxColumn: 80
  redirectRewrite: "none"
  maxHeaderSize: 32768
  maxHeaderCount: 64
  pipelining: "disable"
  adaptiveParsing: false
  proxyType: "reverse"
  passthroughPipeline: "allow"

{{- end }}
