# Check if the CLIENTSSL settings CRD is present in the cluster.
{{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "f5-big-clientssl-settings.k8s.f5net.com") }}

apiVersion: k8s.f5net.com/v1
kind: F5BigClientsslSetting
metadata:
  name: sys-default-clientssl
spec:
  enableTls13: true
  enableSessionTicket: true
  renegotiationMode: "require"

{{- end }}
