# Check if the Downloader CRD is present in the cluster.
{{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "f5-big-cne-downloaders.k8s.f5net.com") }}

# Go through the Downloader CRs in the cluster.
{{- range $crIdx, $cr := (lookup "k8s.f5net.com/v1" "f5-big-cne-downloaders" .Release.Namespace "").items }}
  # Check the index of current Downloader CR.
  {{- if ge $crIdx 1 }}
    # Halt the installation if there is more than one present.
    {{ required "Deployment failed, there can not be more than one instance of <<kind>> custom resource in this namespace. Please remove the extra CRs and try again." nil }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: ResourceQuota
metadata:
  name: f5-single-downloader-quota
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    count/f5-big-cne-downloaders.k8s.f5net.com: 1

{{- end }}