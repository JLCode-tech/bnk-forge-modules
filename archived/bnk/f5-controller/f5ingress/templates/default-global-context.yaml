# Check if the ContextGlobal CRD is present in the cluster.
{{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "f5-big-context-globals.k8s.f5net.com") }}
apiVersion: k8s.f5net.com/v1
kind: F5BigContextGlobal
metadata:
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: ""
  name: global-context
{{- if (lookup "k8s.f5net.com/v1" "F5BigContextGlobal" .Release.Namespace "global-context") }}
# Apply the contents of the existing CR,this is being done to ensure the resource is not empty.
{{- $globContext := (lookup "k8s.f5net.com/v1" "F5BigContextGlobal" .Release.Namespace "global-context") }}
spec:
{{- toYaml $globContext.spec | nindent 2 }}

{{ else }}
# Set defaults if CR is not present
spec:
  firewall:
    defaultAction: "accept"
    defaultActionLog: false

{{- end }}
{{- end }}
