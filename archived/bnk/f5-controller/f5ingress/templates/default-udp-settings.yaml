# Check if the TCP settings CRD is present in the cluster.
{{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "f5-big-udp-settings.k8s.f5net.com") }}

apiVersion: k8s.f5net.com/v1
kind: F5BigUdpSetting
metadata:
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: ""
  name: sys-default-udp
spec:
  allowNoPayload: false
  bufferMaxBytes: 655350
  bufferMaxPackets: 0
  datagramLoadBalancing: false
  idleTimeout: 60
  ipDFMode: "pmtu"
  ipTOSToClient: 0
  ipTTLMode: "proxy"
  ipTTLV4: 255
  ipTTLV6: 64
  linkQOSToClient: 0
  noChecksum: false
  proxyMSS: false
  sendBufferSize: 655350

{{- end }}
