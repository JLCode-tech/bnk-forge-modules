# Check if the BDOS Custom Signature CRD is present in the cluster.
{{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "f5-big-bdos-cust-sigs.k8s.f5net.com") }}

# Go through the BDOS Custom Signature CRs in the cluster. In this case, the len function can not be used.
{{- range $crIdx, $cr := (lookup "k8s.f5net.com/v1" "F5BigBdosCustSig" .Release.Namespace "").items }}
  # Check the index of current BDOS Custom Signature CR.
  {{- if ge $crIdx 1 }}
    # Halt the installation if there is more than one present.
    {{ required "Deployment failed, there can not be more than one instance of F5BigBdosCustSig custom resource in this namespace. Please remove the extra CRs and try again." nil }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: ResourceQuota
metadata:
  name: f5-single-bdos-cust-sig-quota
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    count/f5-big-bdos-cust-sigs.k8s.f5net.com: 1

{{- end }}
