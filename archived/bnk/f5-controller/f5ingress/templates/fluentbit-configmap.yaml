{{- if .Values.controller.fluentbit_sidecar.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: f5-f5ingress-fluentbit-config
  labels:
    k8s-app: fluent-bit
data:
  # Configuration files: server, input, filters and output
  # ======================================================
  fluent-bit.conf: |
    [SERVICE]
        Flush         {{ .Values.controller.fluentbit_sidecar.fluentbit.flush_interval }}
        Log_Level     {{ .Values.controller.fluentbit_sidecar.fluentbit.logLevel }}
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   off
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    @INCLUDE input.conf
    @INCLUDE filter-k8s.conf
    @INCLUDE output-fluentd.conf
    {{- if .Values.controller.fluentbit_sidecar.debug }}
    @INCLUDE output-stdout.conf
    {{- end }}

  input.conf: |
    [INPUT]
        Name              named_pipe
        Tag               kube.f5.log
        Path              /var/run/f5/*.pipe
        Path_Key          path
        # Parser            docker
        buf_size          {{ .Values.controller.fluentbit_sidecar.fluentbit.input.pipes.bufSize }}
        interval_sec      {{ .Values.controller.fluentbit_sidecar.fluentbit.input.pipes.intervalSec }}
        interval_nsec     {{ .Values.controller.fluentbit_sidecar.fluentbit.input.pipes.intervalNsec }}

  filter-k8s.conf: |
    [FILTER]
        Name    record_modifier
        Match   kube.f5.log
        Record  namespace ${NAMESPACE}
        Record  node ${NODE}
        Record  pod ${POD}
        Record  pod_id ${POD_ID}

    [FILTER]
        Name          parser
        Match         kube.f5.log
        Key_Name      pod
        Parser        podname
        Preserve_Key  True
        Reserve_Data  True

    [FILTER]
        Name          parser
        Match         kube.f5.log
        Key_Name      path
        Parser        filename
        Reserve_Data  True

  output-stdout.conf: |
    [OUTPUT]
        Name            stdout
        Match           kube.f5.log

  output-fluentd.conf: |
    [OUTPUT]
        Name          forward
        Match         kube.f5.log
        Host          {{ .Values.controller.fluentbit_sidecar.fluentd.host }}
        Port          {{ .Values.controller.fluentbit_sidecar.fluentd.port | default 54321 }}
        {{- if .Values.controller.fluentbit_sidecar.fluentbit.tls.enabled }}
        tls               On
        tls.debug         {{ .Values.controller.fluentbit_sidecar.fluentbit.tls.debug }}
        tls.verify        {{ .Values.controller.fluentbit_sidecar.fluentbit.tls.verify }}
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        tls.ca_file       /tls/f5ingressfluentbit/tcp/clt/ca.pem
        tls.crt_file      /tls/f5ingressfluentbit/tcp/clt/f5ingressfluentbit-tcp-clt.pem
        tls.key_file      /tls/f5ingressfluentbit/tcp/clt/f5ingressfluentbit-tcp-clt-key.pem
        {{- else }}
        tls.ca_file       /tls/f5ingressfluentbit/tcp/clt/ca.crt
        tls.crt_file      /tls/f5ingressfluentbit/tcp/clt/tls.crt
        tls.key_file      /tls/f5ingressfluentbit/tcp/clt/tls.key
        {{- end }}
        Shared_Key        {{ .Values.controller.fluentbit_sidecar.fluentbit.tls.shared_key }}
        {{- end }}


  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        # Add new field 'type'(stdout or stderr) to logs
        # To parse '/var/run/f5/f5ingress_(stdout|stderr).pipe'
        Name   filename
        Format regex
        Regex  \/(?<service>[^\/_]+(?:_[^\/_]+)*)_(?<type>stdout|stderr)\.pipe$

    [PARSER]
        # Add new field 'pod_name' to logs
        # To parse 'tmp-tmm-example-75cc78f9c6-tgr5b'
        Name podname
        Format regex
        Regex (?<pod_name>.+)-[a-z0-9]{9,10}-[a-z0-9]{5}$
{{- end -}}