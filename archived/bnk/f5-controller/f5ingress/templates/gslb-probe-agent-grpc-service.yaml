{{- if and .Values.gslbProbeAgent.enabled (index .Values "f5-tmm").enabled (index .Values "f5-tmm").tmm.grpc.enabled }}
{{ $port := (.Values.gslbProbeAgent.grpc.port | int )}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gslbProbeAgent.grpc.name }}
  labels:
    app: {{ .Values.gslbProbeAgent.name }}
    type: grpc
spec:
  ipFamilyPolicy: PreferDualStack
  selector:
    app: {{ .Values.gslbProbeAgent.name }}
  ports:
    - protocol: TCP
      name: grpc-gslb-probe-agent
      port: {{ $port }}
      targetPort: {{ $port }}
{{- end }}
---
{{- if .Values.gslbProbeAgent.f5_csm_qkview.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gslbProbeAgent.name }}
  labels:
    app: {{ .Values.gslbProbeAgent.name }}
spec:
  selector:
    app: {{ .Values.gslbProbeAgent.name }}
  ports:
    {{ $grpcport_gslb := (.Values.gslbProbeAgent.f5_csm_qkview.grpc_port | int)}}
    - protocol: TCP
      name: qkview-grpc-probeagent
      port: {{ $grpcport_gslb }}
      targetPort: {{ $grpcport_gslb }}
{{- end }}
