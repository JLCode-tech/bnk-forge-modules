{{- if and .Values.gslbEngine.enabled .Values.gslbEngine.tmstat.enabled (index .Values "f5-tmm").enabled (index .Values "f5-tmm").debug.enabled }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: gslb-tmstat
spec:
  accessModes:
    - {{ .Values.gslbEngine.tmstat.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.gslbEngine.tmstat.size | quote }}
  storageClassName: {{ .Values.gslbEngine.tmstat.storageClassName | quote }}
{{- end -}}
