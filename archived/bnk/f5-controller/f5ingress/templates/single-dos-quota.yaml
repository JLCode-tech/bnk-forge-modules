# Check if the DOS CRD is present in the cluster.
{{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "f5-big-ddos-globals.k8s.f5net.com") }}

# Go through the DOS CRs in the cluster. In this case, the len function can not be used.
{{- range $crIdx, $cr := (lookup "k8s.f5net.com/v1" "F5BigDdosGlobal" .Release.Namespace "").items }}
  # Check the index of current DOS CR.
  {{- if ge $crIdx 1 }}
    # Halt the installation if there is more than one present.
    {{ required "Deployment failed, there can not be more than one instance of F5BigDdosGlobal custom resource in this namespace. Please remove the extra CRs and try again." nil }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: ResourceQuota
metadata:
  name: f5-single-dos-quota
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    count/f5-big-ddos-globals.k8s.f5net.com: 1

{{- end }}
