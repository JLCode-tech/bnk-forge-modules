---
#certificate for communication from ingress controller to csm-qkview to trigger Qkview process
{{- if .Values.controller.f5_csm_qkview.enabled }}
{{- if .Values.global.certmgr.external }}
apiVersion: cert-manager.io/v1
{{- else }}
apiVersion: cm.f5co.k8s.f5net.com/v1
{{- end }}
kind: Certificate
metadata:
  name: tls-f5-controller-grpc-svr
  namespace: {{ .Release.Namespace }}
spec:
  subject:
    countries:
      - US
    provinces:
      - Washington
    localities:
      - Seattle
    organizations:
      - F5 Networks
    organizationalUnits:
      - PD
  emailAddresses:
    - clientcert@f5net.com
  dnsNames:
    - {{ include "f5ingress.appName" . }}.{{ .Release.Namespace }}
  commonName: f5net.com
  # SecretName is the name of the secret resource that will be automatically created and managed by this Certificate resource.
  # It will be populated with a private key and certificate, signed by the denoted issuer.
  secretName: tls-f5-controller-grpc-svr-secret
  # IssuerRef is a reference to the issuer for this certificate.
  {{- if .Values.global.certmgr.external }}
  issuerRef: {{ toYaml .Values.global.certmgr.issuerRef | nindent 4 }}
  {{- else }}
  issuerRef:
    name: default-cert-issuer
    kind: ClusterIssuer
  {{- end }}
  privateKey:
    rotationPolicy: Always
    encoding: PKCS1
    algorithm: RSA
    size: 4096
  # Lifetime of the Certificate. 360 days(long-lived).
  duration: 1h
  revisionHistoryLimit: 10
{{- end }}
---
#certificate for communication from CWC Orchestrator to Qkview process
{{- if .Values.controller.fluentbit_sidecar.f5_csm_qkview.enabled }}
{{- if .Values.global.certmgr.external }}
