{{- if and (not .Values.controller.Only) (.Values.dnsx.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.dnsx.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.dnsx.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.dnsx.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.dnsx.name }}
      annotations:
      {{- if .Values.dnsx.annotations }}
{{ toYaml .Values.dnsx.annotations | indent 8 }}
      {{- end }}
      {{- if (index .Values "f5-tmm").enabled }}
      {{- if (index .Values "f5-tmm").tmm.cniNetworks }}
      {{- if eq (index .Values "f5-tmm").tmm.robinNetworks "true"}}
        robin.io/networks: {{ toYaml (index .Values "f5-tmm").tmm.cniNetworks }}
      {{- else }}
        k8s.v1.cni.cncf.io/networks: "{{ (index .Values "f5-tmm").tmm.cniNetworks }}"
      {{- end }}
      {{- end }}
      {{- end }}
    spec:
      hostname: {{ .Values.dnsx.name }}
      subdomain: {{ .Values.dnsx.grpc.name }}
      {{- if .Values.dnsx.nodeSelector }}
      nodeSelector:
        {{ toYaml .Values.dnsx.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.dnsx.tolerations }}
      tolerations:
{{ toYaml .Values.dnsx.tolerations | indent 8 }}
      {{- end }}
      {{- if .Values.dnsx.affinity }}
      affinity:
        {{ toYaml .Values.dnsx.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.dnsx.serviceAccount.name }}
      serviceAccountName:
        {{ include "dnsx.serviceAccountName" . }}
      {{- end }}
      {{- if and .Values.imageCredentials .Values.imageCredentials.name }}
      imagePullSecrets:
        - name: {{ .Values.imageCredentials.name }}
      {{- else }}
      imagePullSecrets: []
      {{- end }}
      containers:
      - image: "{{ .Values.dnsx.image.repository }}/{{ .Values.dnsx.image.name }}:{{ .Values.dnsx.image.tag }}"
        name: {{ .Values.dnsx.name }}
        imagePullPolicy: {{ .Values.dnsx.image.pullPolicy }}
        {{- if not .Values.dnsx.start }}
        command: ["tail", "-f", "/dev/null"]
        {{- end }}
        securityContext:
          readOnlyRootFilesystem: true
          {{- if .Values.dnsx.securityContext }}
          privileged: {{ .Values.dnsx.securityContext.privileged }}
            {{- if .Values.dnsx.securityContext.runAsUser }}
          runAsUser: {{ .Values.dnsx.securityContext.runAsUser }}
            {{- end }}
          {{- end }}
          capabilities:
            add:
            - IPC_LOCK
        ports:
          - name: grpc-port
            containerPort: {{ .Values.dnsx.f5_csm_qkview.grpc_port | int }}
            protocol: TCP
        resources:
          {{- toYaml .Values.dnsx.resources | nindent 10 }}
        volumeMounts:
        {{- include "volumeMounts.spk" . | nindent 8 }}
        - name: vol-mount-tmp
          mountPath: /tmp
          readOnly: false
        - name: vol-mount-run
          mountPath: /var/run
          readOnly: false
        - name: vol-mount-logs
          mountPath: /logs
          readOnly: false
        - name: vol-mount-tmp-volume
          mountPath: /var/tmp
          readOnly: false
        - name: vol-mount-config
          mountPath: /config
          readOnly: false
        - name: vol-mount-etc-qkview-collect
          mountPath: /etc/qkview-collect
          readOnly: false
        - name: dnsx-storage
          mountPath: /shared/zxfrd
          readOnly: false
        - name: tls-zxfrd-grpc-svr-volume
          mountPath: /tls/f5-zxfrd/grpc/svr
          readOnly: true
        {{- if .Values.dnsx.f5_csm_qkview.enabled }}
        - name: tls-qkview-zxfrd-grpc-svr-volume
          mountPath: /tls/qkview-zxfrd/grpc/svr/
          readOnly: true
        {{- end }}
        - name: dnsx-tmstat
          mountPath: /var/tmstat
          readOnly: false
        {{- if .Values.dnsx.fluentbit_sidecar.enabled }}
        - name: f5-log-pipes
          mountPath: /var/log/f5
          readOnly: false
        {{- end }}
        {{- if (eq .Values.global.platformType "robin") }}
        - mountPath: /var/crash
          name: f5-core-store
          readOnly: false
        {{- end }}
        env:
        {{- include "env.spk" (dict "cVersion" .Values.dnsx.image.tag ) | nindent 8 }}
        - name: GRPC_PORT
          value: "{{ .Values.dnsx.grpc.port }}"
        - name: GRPC_CERT_PATH
          value: /tls/f5-zxfrd/grpc/svr/tls.crt
        - name: GRPC_KEY_PATH
          value: /tls/f5-zxfrd/grpc/svr/tls.key
        - name: GRPC_CA_ROOT_PATH
          value: /tls/f5-zxfrd/grpc/svr/ca.crt
        - name: EXPORT_TELEMETRY
          value: {{ if .Values.dnsx.fluentbit_sidecar.enabled }}"true"{{ else }}"false"{{ end }}
        {{- if .Values.dnsx.f5_csm_qkview.enabled }}
        - name: QK_GRPC_PORT
          value: "{{ .Values.dnsx.f5_csm_qkview.grpc_port }}"
        - name: QK_TLS_CA_BUNDLE
          value: /tls/qkview-zxfrd/grpc/svr/ca.crt
        - name: QK_TLS_CERT_FILE
          value: /tls/qkview-zxfrd/grpc/svr/tls.crt
        - name: QK_TLS_KEY_FILE
          value: /tls/qkview-zxfrd/grpc/svr/tls.key
        - name: QK_TLS_CERT_RETRY_WAIT
          value: "5s"
        - name: SPK_QKVIEW_ENABLED
          value: "{{ .Values.dnsx.f5_csm_qkview.enabled }}"
        {{- end }}
        - name: CONTAINER_NAME
          value: "qkview-zxfrd"
        - name: DEBUG
          value: "{{ .Values.dnsx.debug.enabled }}"
        {{- if .Values.dnsx.k8sprobes.enabled }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.dnsx.grpc.port }}
          initialDelaySeconds: 5
          periodSeconds: 1
        livenessProbe:
          tcpSocket:
            port: {{ .Values.dnsx.grpc.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 16
          failureThreshold: 3
        {{- end }}
      {{- if .Values.dnsx.fluentbit_sidecar.enabled }}
      - image: "{{ .Values.dnsx.fluentbit_sidecar.image.repository }}/{{ .Values.dnsx.fluentbit_sidecar.image.name }}:{{ .Values.dnsx.fluentbit_sidecar.image.tag }}"
        name: {{ .Values.dnsx.fluentbit_sidecar.name }}
        imagePullPolicy: {{ .Values.dnsx.fluentbit_sidecar.image.pullPolicy }}
        {{- if .Values.dnsx.securityContext }}
        securityContext:
          readOnlyRootFilesystem: true
          privileged: {{ .Values.dnsx.securityContext.privileged }}
          {{- if .Values.dnsx.securityContext.runAsUser }}
          runAsUser: {{ .Values.dnsx.securityContext.runAsUser }}
          {{- end }}
        {{- end }}
        stdin: true
        tty: true
        env: {{- toYaml .Values.dnsx.fluentbit_sidecar.env | nindent 12 }}
        volumeMounts:
        - name: f5-log-pipes
          mountPath: /var/log/f5
          readOnly: false
        - name: f5-dnsx-fluentbit-config
          mountPath: /fluent-bit/etc/
          readOnly: false
        - name: vol-mount-tmp
          mountPath: /tmp
          readOnly: false
        - name: vol-mount-run
          mountPath: /var/run
          readOnly: false
        {{- if .Values.dnsx.fluentbit_sidecar.fluentbit.tls.enabled }}
        {{- toYaml .Values.dnsx.fluentbit_sidecar.volumeMountsTls | nindent 8 }}
        {{- end}}
      {{- end }}
      volumes:
      {{- include "volumes.spk" . | nindent 6 }}
      - name: vol-mount-tmp
        emptyDir: {}
      - name: vol-mount-run
        emptyDir: {}
      - name: vol-mount-logs
        emptyDir: {}
      - name: vol-mount-tmp-volume
        emptyDir: {}
      - name: vol-mount-config
        emptyDir: {}
      - name: vol-mount-etc-qkview-collect
        emptyDir: {}
      - name: dnsx-storage
        persistentVolumeClaim:
          claimName: dnsx-storage
      - name: tls-zxfrd-grpc-svr-volume
        secret:
          secretName: tls-zxfrd-grpc-svr-secret
      {{- if .Values.dnsx.f5_csm_qkview.enabled }}
      - name: tls-qkview-zxfrd-grpc-svr-volume
        secret:
          secretName: tls-qkview-zxfrd-grpc-svr-secret
      {{- end }}
      - name: dnsx-tmstat
      {{- if and .Values.dnsx.tmstat.enabled (index .Values "f5-tmm").enabled (index .Values "f5-tmm").debug.enabled }}
        persistentVolumeClaim:
          claimName: dnsx-tmstat
      {{- else }}
        emptyDir: {}
      {{- end }}
      {{- if .Values.dnsx.fluentbit_sidecar.enabled }}
      - name: f5-log-pipes
        emptyDir: {}
      - name: f5-dnsx-fluentbit-config
        configMap:
          name: f5-dnsx-fluentbit-config
      {{- if .Values.dnsx.fluentbit_sidecar.fluentbit.tls.enabled }}
      - name: tls-zxfrd-fluentbit-tcp-clt-volume
        secret:
          secretName: tls-zxfrd-fluentbit-tcp-clt-secret
      {{- end }}
      {{- end }}
      {{- if (eq .Values.global.platformType "robin") }}
      - name: f5-core-store
        hostPath:
          path: /home/crash/f5
      {{- end }}

{{- end }}
