# Check if the HTTP2 settings CRD is present in the cluster.
{{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "f5-big-http2-settings.k8s.f5net.com") }}

apiVersion: k8s.f5net.com/v1
kind: F5BigHttp2Setting
metadata:
  name: sys-default-http2
spec:
  activationModes: "alpn"
  concurrentStreamsPerConnection: 10
  connectionIdleTimeout: 300
  frameSize: 2048
  insertHeader: false
  insertHeaderName: "X-HTTP2"
  receiveWindow: 32
  writeSize: 16384
  headerTableSize: 4096
  enforceTlsRequirements: true

{{- end }}
