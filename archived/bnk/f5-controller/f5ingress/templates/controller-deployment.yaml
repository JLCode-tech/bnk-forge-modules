          value: {{ .Values.controller.crdupdater.grpc.ca | default "ca_root.crt" }}
        - name: GRPC_SRV_CERT
          value: {{ .Values.controller.crdupdater.grpc.cert | default "grpc-crdupdater-server.crt" }}
        - name: GRPC_SRV_KEY
          value: {{ .Values.controller.crdupdater.grpc.key | default "grpc-crdupdater-server.key" }}
        - name: GRPC_CLIENT_CA
          value: {{ .Values.controller.crdupdater.grpc.client_ca | default "ca_root.crt" }}
