{{- if and (eq .Values.controller.kind "deployment") (not (index .Values "f5-tmm").tmm.Only) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ default (include "f5ingress.name" .) .Values.controller.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    product-version: {{ .Values.product.version }}
    {{- include "f5ingress.labels" . | nindent 4 }}
    metrics-prometheus: publish

spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "f5ingress.appName" . }}
  template:
    metadata:
      labels:
        product-version: {{ .Values.product.version }}
        metrics-prometheus: publish
        app: {{ include "f5ingress.appName" . }}
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        tenant-selector: {{ .Release.Name }}-tenant
        qkview-collect: {{ .Release.Name }}
        {{- end }}

{{- if or (and (index .Values "f5-tmm").enabled (index .Values "f5-tmm").tmm.scaling.enable) (.Values.controller.pod.annotations) }}
      annotations:
{{- if and (index .Values "f5-tmm").enabled (index .Values "f5-tmm").tmm.grpc.enabled }}
{{ toYaml (index .Values "f5-tmm").tmm.grpc.annotations | indent 8 }}
{{- end}}

{{- if .Values.controller.pod.annotations }}
{{ toYaml .Values.controller.pod.annotations | indent 8 }}
{{- end }}
{{- end }}
    spec:
      {{- if .Values.controller.securityContext }}
      securityContext:
        {{- if .Values.controller.securityContext.fsGroup }}
        fsGroup: {{ .Values.controller.securityContext.fsGroup }}
        {{- end }}
      {{- end }}
      {{- if and .Values.imageCredentials .Values.imageCredentials.name }}
      imagePullSecrets:
        - name: {{ .Values.imageCredentials.name }}
      {{- else }}
      imagePullSecrets: []
      {{- end }}
{{- if .Values.controller.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.controller.nodeSelector | indent 8 }}
{{- end }}
{{- if .Values.controller.tolerations }}
      tolerations:
{{ toYaml .Values.controller.tolerations | indent 6 }}
{{- end }}
{{- if .Values.controller.affinity }}
      affinity:
{{ toYaml .Values.controller.affinity | indent 8 }}
{{- end }}
      serviceAccountName: {{ include "f5ingress.serviceAccountName" . }}
      hostNetwork: {{ .Values.controller.hostNetwork }}
      containers:
      - image: "{{ .Values.controller.image.repository | required ".Values.controller.image.repository is required." }}/{{ .Values.controller.image.name }}:{{ .Chart.AppVersion }}"
        name: {{ include "f5ingress.name" . }}
        imagePullPolicy: "{{ .Values.controller.image.pullPolicy }}"
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        {{- if .Values.controller.command_ve }}
        command:
        {{ toYaml .Values.controller.command_ve | nindent 10 }}
        {{- end }}
        {{- else }}
        {{- if .Values.controller.command_cnf }}
        command:
        {{ toYaml .Values.controller.command_cnf | nindent 10 }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: vol-mount-tmp
          mountPath: /tmp
          subPath: f5ingress-tmp          
          readOnly: false
        - name: vol-mount-run
          mountPath: /run
          subPath: f5ingress-run
          readOnly: false
        - name: vol-mount-logs
          mountPath: /logs
          subPath: f5ingress-logs
          readOnly: false    
{{- if (eq .Values.global.platformType "robin") }}
        - mountPath: /var/crash
          name: f5-core-store
          readOnly: false
{{- end }}
{{- if and (index .Values "f5-tmm").enabled (index .Values "f5-tmm").tmm.grpc.enabled }}
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        - name: pv-data
          subPath: f5ingress-grpc-clt
          mountPath: /tls/f5ingress/grpc/clt
        {{- else }}
        - name: tls-f5ingress-grpc-clt-volume
          mountPath: /tls/f5ingress/grpc/clt
        {{- end }}
{{- end }}
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        - name: pv-data
          subPath: logs
          mountPath: /logs
        {{- else }} 
        {{- include "volumeMounts.spk" . | nindent 8 }}
        {{- end }}
{{- if .Values.controller.f5_csm_qkview.enabled }}
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        - name: pv-data
          subPath: f5ingress-qkview
          mountPath: /tls/f5ingress/qkview
        {{- else }}
        - name: tls-f5-controller-grpc-svr-volume
          mountPath: /tls/f5-controller/grpc/svr
          readOnly: true
        {{- end }}
{{- end }}
{{- if and (index .Values "f5-tmm").enabled (index .Values "f5-tmm").tmm.grpc.enabled }}
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        - name: pv-data
          subPath: f5ingress-webhookvalidating-svr
          mountPath: /tls/f5ingress/webhookvalidating/svr
        {{- else }}
        - name: tls-f5ingress-webhookvalidating-svr-volume
          mountPath: /tls/f5ingress/webhookvalidating/svr 
        {{- end }}
{{- end }}
{{- if .Values.controller.fluentbit_sidecar.enabled }}
        - name: f5-log-pipes
          mountPath: /var/run/f5
{{- end }}
        - name: f5-msg-pipes
          mountPath: /var/run/msg
        ports:
{{- if .Values.controller.f5ingressDebug }}
        - name: debug-web
          containerPort: {{ .Values.controller.debug.port }}
{{- end }}
{{- if .Values.controller.f5_csm_qkview.enabled }}
        - name: qkview-collect
          containerPort: {{ .Values.controller.f5_csm_qkview.grpc.port }}
          protocol: TCP
{{- end }}

{{- if and (index .Values "f5-tmm").enabled (index .Values "f5-tmm").tmm.scaling.enable }}
        - name: prometheus
          containerPort: {{ (index .Values "f5-tmm").tmm.scaling.prometheus.port }}
{{- end }}
        resources:
{{ toYaml .Values.controller.resources | indent 10 }}
        {{- if .Values.controller.securityContext}}
        securityContext:
          allowPrivilegeEscalation: {{ .Values.controller.securityContext.allowPrivilegeEscalation }}
          privileged: {{ .Values.controller.securityContext.privileged }}
          readOnlyRootFilesystem: {{ .Values.controller.securityContext.readOnlyRootFilesystem }}
          {{- if .Values.controller.securityContext.runAsNonRoot }}
          runAsNonRoot: {{ .Values.controller.securityContext.runAsNonRoot }}
          {{- end }}
          {{- if .Values.controller.securityContext.runAsUser }}
          runAsUser: {{ .Values.controller.securityContext.runAsUser }}
          {{- end }}
          {{- if .Values.controller.securityContext.runAsGroup }}
          runAsGroup: {{ .Values.controller.securityContext.runAsGroup }}
          {{- end }}
        {{- end }}
#       # Exposed metadata to environment variable used by f5ingress.
        env:
        {{- if (ne .Values.global.platformType "mbip-ve") }}
        {{- include "env.spk" (dict "cName" "f5-controller" "cVersion" .Chart.AppVersion  ) | nindent 8 }}
        {{- end }}
        {{- if .Values.controller.f5_csm_qkview.enabled }}
        - name: QK_GRPC_PORT
          value: "{{ .Values.controller.f5_csm_qkview.grpc.port }}"
        - name: QK_TLS_CERT_RETRY_WAIT
          value: "5s"
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        - name: QK_TLS_CA_BUNDLE
          value: "/tls/f5ingress/qkview/ca.pem"
        - name: QK_TLS_CERT_FILE
          value: "/tls/f5ingress/qkview/f5ingress-qkview.pem"
        - name: QK_TLS_KEY_FILE
          value: "/tls/f5ingress/qkview/f5ingress-qkview-key.pem"
        - name: CONTAINER_NAME
          value: {{ include "f5ingress.name" . }}
        - name: F5_CONSOLE_LOGGING_ENABLED
          value: "true"
        {{- else }}
        - name: QK_TLS_CA_BUNDLE
          value: "/etc/ssl/certs/ca-root-cert.pem"
        - name: QK_TLS_CERT_FILE
          value: "/etc/ssl/certs/server-cert.pem"
        - name: QK_TLS_KEY_FILE
          value: "/etc/ssl/certs/server-key.pem"
        - name: USING_CERT_ORCHESTRATOR
          value: "true"
        {{- end }}
        {{- end }}
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        - name: VAULT_ROLE_NAME
        # TODO: this needs the common tenant prefix, whenever the common helm charts are included in this repo
          value: {{ .Values.global.gslb.vault.roleName }}
        - name: VAULT_PORT
          value: "{{ .Values.global.gslb.vault.port }}"
        - name: VAULT_HOST
          value: {{ .Values.global.gslb.vault.vaultHost }}      
        {{- end }}
        - name: REPORT_INTERVAL
          value: {{ .Values.controller.report.interval | quote }}
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_QPS
          value: "{{ .Values.controller.advanced.k8sQPS }}"
        - name: K8S_BURST
          value: "{{ .Values.controller.advanced.k8sBurst }}"
        - name: PLATFORM_TYPE
          value: "{{ .Values.global.platformType }}"
        - name: CONTROLLER_APP_LABEL
          value: {{ include "f5ingress.appName" . }}
        - name: TMM_CONFIGMAPS
          value: $(POD_NAMESPACE)/{{ include "f5ingress.configName" . }}
        {{- if .Values.controller.crashFlag.enabled }}
        - name: IS_CRASHFLAG_ENABLED
          value: "{{ .Values.controller.crashFlag.enabled}}"
        {{- end }}
        - name: INGRESS_CLASS
          value: "{{ .Values.controller.ingressClass }}"
        - name: USE_INGRESS_CLASS_ONLY
          value: "{{ .Values.controller.useIngressClassOnly }}"
        {{- if .Values.controller.watchNamespace }}
        - name: WATCH_NAMESPACE
          value: {{ include "f5ingress.watchNamespaceString" . }}
        {{- end }}
        - name: GRPC_ENFORCE_ALPN_ENABLED
          value: "false"
        - name: CWC_NAMESPACE
          value: "{{ .Values.controller.cwcNamespace | default "default" }}"
        - name: HEALTH_STATUS
          value: "{{ .Values.controller.healthStatus }}"
        - name: HEALTH_STATUS_URI
          value: "{{ .Values.controller.healthStatusURI }}"
        - name: DEBUG_WEB_PORT
          value: "{{ .Values.controller.debug.port }}"
        - name: F5INGRESS_DEBUG
          value: "{{ .Values.controller.f5ingressDebug }}"
        - name: CREATE_TMM_LB_SERVICE
          value: "{{ .Values.controller.createTmmLBService }}"
        - name: LOG_LEVEL
          value: "{{ .Values.controller.logLevel }}"
{{- if .Values.controller.reportIngressStatus.enable }}
        - name: IS_REPORTINGRESS_STATUS_ENABLED
          value: {{ if (index .Values "controller" "reportIngressStatus" "enable") }}"true"{{ else }}"false"{{ end }}
{{- end }}
        - name: VALIDATION_SVC_PORT
          value: "{{ .Values.controller.validationService.port }}"
        - name: VALIDATION_SVC_SSLKEYPATH
          value: "{{ .Values.controller.validationService.sslKeyPath }}"
        - name: VALIDATION_SVC_SSLCERTPATH
          value: "{{ .Values.controller.validationService.sslCertPath }}"
        - name: VALIDATION_SVC_SSLKEYNAME
          value: "{{ .Values.controller.validationService.sslKeyName }}"
        - name: VALIDATION_SVC_SSLCERTNAME
          value: "{{ .Values.controller.validationService.sslCertName}}"
{{- if (index .Values "f5-tmm").enabled }}
        - name: ENABLE_PROMETHEUS_METRICS
          value: "{{ (index .Values "f5-tmm").tmm.scaling.enable }}"
        - name: PROMETHEUS_METRICS_LISTEN_PORT
          value: "{{ (index .Values "f5-tmm").tmm.scaling.prometheus.port }}"
        - name: ENABLE_VXLAN
          value: "{{ (index .Values "f5-tmm").tmm.vxlan.enabled }}"
        - name: VXLAN_NAME
          value: "{{ (index .Values "f5-tmm").tmm.vxlan.name }}"
        - name: VXLAN_PORT
          value: "{{ (index .Values "f5-tmm").tmm.vxlan.port }}"
        - name: VXLAN_KEY
          value: "{{ (index .Values "f5-tmm").tmm.vxlan.key }}"
        - name: VXLAN_LOCAL_IP
          value: "{{ (index .Values "f5-tmm").tmm.vxlan.localIp }}"
        - name: VXLAN_SELF_IP
          value: "{{ (index .Values "f5-tmm").tmm.vxlan.selfIp }}"
        - name: FBD_OVERRIDE
          value: "{{ (index .Values "f5-tmm").tmm.vxlan.workaroundFdbOverrides }}"
        - name: USE_FLANNEL
          value: "{{ (index .Values "f5-tmm").tmm.vxlan.useFlannel }}"
        - name: STATIC_ROUTE_NODE_NETMASK
          value: "{{ (index .Values "f5-tmm").tmm.vxlan.staticRouteNodeNetmask }}"
        - name: STATIC_ROUTE_POOL_MEMBER_NETMASK
          value: "{{ (index .Values "f5-tmm").tmm.vxlan.staticRoutePoolMemberNetmask }}"
        - name: USE_SNATPOOL
          value: "{{ (index .Values "f5-tmm").tmm.egress.useSnatpools }}"
        - name: TMM_APP_LABEL
          value: "{{ (index .Values "f5-tmm").tmm.name }}"
{{- end }}
        - name: EGRESS_SNATPOOL_NAME
          value: "{{ .Values.controller.egress.snatpoolName }}"
        - name: PCCD_ENABLED
          value: "{{ and .Values.global.afm.enabled  .Values.global.afm.pccd.enabled }}"
        - name: PCCD_CONT_ENABLED
          value: "{{ and (index .Values "f5-afm").enabled  (index .Values "f5-afm").afm.pccd.enabled }}"
        - name: IPSD_ENABLED
          value: "{{ (index .Values "f5-ipsd").enabled }}"
        - name: DWBLD_ENABLED
          value: "{{ (index .Values "f5-dwbld").enabled }}"
        - name: DOWNLOADER_ENABLED
          value: "{{ (index .Values "f5-downloader").enabled }}"
        - name: GSLB_ENGINE_ENABLED
          value: "{{ .Values.gslbEngine.enabled }}"
        - name: GSLB_PROBE_AGENT_ENABLED
          value: "{{ .Values.gslbProbeAgent.enabled }}"
        - name: DNSX_ENABLED
          value: "{{ .Values.dnsx.enabled }}"
        {{- if .Values.gslbEngine.enabled }}
        - name: GSLB_SERVER_NAME
          value: {{ required "A valid .Values.gslbEngine.gslbEngineServerName entry required!" .Values.gslbEngine.gslbEngineServerName }}
        - name: PROBE_AGENT_SERVER_NAME
          value: {{ required "A valid .Values.gslbProbeAgent.gslbProbeAgentServerName entry required!" .Values.gslbProbeAgent.gslbProbeAgentServerName }}
        {{- if and (ne .Values.global.platformType "mbip-ve") ((index .Values "f5-tmm").tmm.pseudoCNI.enabled) }}
        - name: GSLB_NODE_INTERFACE_NAME
          value: {{ required "A valid .Values.gslbEngine.interfacename entry required!" .Values.gslbEngine.interfacename }}
        {{- end }} # if ne .Values.global.platformType "mbip-ve"
        {{- end }}
        - name: CRDUPDATE_ENABLED
          value: "{{ and (index .Values "f5-downloader").enabled .Values.controller.crdupdater.enabled }}"
        - name: SNIC_MGR_ENABLED
          value: "{{ .Values.global.snicmgr.enabled }}"
        - name: SNIC_LACPD_ENABLED
          value: "{{ .Values.global.lacpd.enabled }}"
        - name: BDOSD_ENABLED
          value: "{{ .Values.global.bdosd.enabled }}"
        - name: CSRC_NAMESPACE
          value: "{{ .Values.controller.csrcNamespace | default .Release.Namespace }}"


{{- if (index .Values "f5-tmm").enabled }}
        {{- if (index .Values "f5-tmm").tmm.grpc.enabled }}
        - name: GRPC_ENABLED
          value: "{{ (index .Values "f5-tmm").tmm.grpc.enabled }}"
        - name: GRPC_SERVICE_NAME
          value: "{{ (index .Values "f5-tmm").tmm.grpc.name }}"
        - name: PCCD_GRPC_SERVICE_NAME
          value: "{{ .Values.global.afm.pccd.grpc.name }}"
        - name: IPSD_GRPC_SERVICE_NAME
          value: "{{ .Values.global.ipsd.grpc.name }}"
        - name: DWBLD_GRPC_SERVICE_NAME
          value: "{{ .Values.global.dwbld.grpc.name }}"
        - name: SNIC_MGR_GRPC_SERVICE_NAME
          value: "{{ .Values.global.snicmgr.grpc.name }}"
        - name: SNIC_LACPD_GRPC_SERVICE_NAME
          value: "{{ .Values.global.lacpd.grpc.name }}"
        - name: BDOSD_GRPC_SERVICE_NAME
          value: "{{ .Values.global.bdosd.grpc.name }}"
        - name: DOWNLOADER_GRPC_SERVICE_NAME
          value: "{{ .Values.global.downloader.grpc.name }}"
        - name: GSLB_ENGINE_GRPC_SERVICE_NAME
          value: "{{ .Values.gslbEngine.grpc.name }}"
        - name: GSLB_PROBE_AGENT_GRPC_SERVICE_NAME
          value: "{{ .Values.gslbProbeAgent.grpc.name }}"
        - name: DNSX_GRPC_SERVICE_NAME
          value: "{{ .Values.dnsx.grpc.name }}"
        - name: ANALYZER_ENABLED
          value: "{{ (index .Values "f5-analyzer").enabled }}"
        - name: ANALYZER_GRPC_SERVICE_NAME
          value: "{{ (index .Values "f5-analyzer").grpc.name }}"
  
        {{- end }}
        {{- if (index .Values "f5-tmm").tmm.network.attachment.definitionName }}
        - name: TMM_NETWORK_ATTACHMENT_DEFINITIONNAME
          value: "{{ (index .Values "f5-tmm").tmm.network.attachment.definitionName }}"
        {{- end }}
        {{- if (index .Values "f5-tmm").tmm.network.attachment.address}}
        - name: NETWORK_ATTACHMENT_ADDRESS
          value: "{{ (index .Values "f5-tmm").tmm.network.attachment.address }}"
        {{- end }}
        {{- if (index .Values "f5-tmm").tmm.network.vfio.enabled}}
        - name: USE_VFIO
          value: "{{ (index .Values "f5-tmm").tmm.network.vfio.enabled }}"
        {{- end }}
        {{- if (index .Values "f5-tmm").tmm.icni2.enabled }}
        - name: ICNI20_ENABLED
          value: "{{ (index .Values "f5-tmm").tmm.icni2.enabled }}"
        {{- end }}
        {{- if (index .Values "f5-tmm").tmm.ovn_meg.enabled }}
        - name: OVN_MEG_ENABLED
          value: "{{ (index .Values "f5-tmm").tmm.ovn_meg.enabled }}"
        {{- end }}
        {{- if (index .Values "f5-tmm").tmm.pseudoCNI.enabled }}
        - name: PSEUDO_CNI_ENABLED
          value: "true"
        {{- end }}
        {{- if (index .Values "f5-tmm").tmm.bfdToOVN.enabled }}
        {{- if and ((index .Values "f5-tmm").tmm.dynamicRouting.enabled) (.Values.controller.watchNamespace) }}
        - name: BFD_TO_OVN_ENABLED
          value: "{{ (index .Values "f5-tmm").tmm.bfdToOVN.enabled }}"
        {{- else if not (index .Values "f5-tmm").tmm.dynamicRouting.enabled }}
          {{ fail "tmm.dynamicRouting is required for BFD to OVN." }}
        {{- else }}
          {{ fail "controller.watchNamespace is required for BFD to OVN." }}
        {{- end }}
        {{- end }}
{{- end }}
        {{- if and (index .Values "f5-downloader").enabled .Values.controller.crdupdater.enabled }}
        - name: GRPC_CRDUPDATE_PORT
          value: "{{ .Values.controller.crdupdater.grpc.port | default "8750" }}"
        {{- end }}
        {{- if .Values.controller.fluentbit_sidecar.enabled }}
        - name: SIDECAR_ENABLED
          value: "true"
        {{- end }}
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        - name: BIGCNE_VE
          value: "true"
        - name: BIGIP_NEXT_GRPC_TMM_PORT
          value: "{{ (index .Values "f5-tmm").tmm.grpc.port | default "8750" }}"
        - name: TMM_APP_KEY
          value: "app.kubernetes.io/name"
        {{- end }}
        - name: MAX_ACTIVE_TMM_REPLICAS
          value: "{{ .Values.controller.maxActiveReplicas }}"
        - name: TMM_DEFAULT_MTU
          value: "{{ .Values.global.tmmDefaultMTU }}"
        {{- if .Values.controller.extraEnvs }}
{{ toYaml .Values.controller.extraEnvs | indent 8 }}
        {{- end }}
        {{- if .Values.global.enableReleaseConfig }}
        envFrom: 
          - configMapRef:
                name: {{ .Values.releaseConfig | default .Release.Name }}-configmap
        {{- end }}
{{- end }}
{{- if .Values.controller.tmm_pod_manager.enabled }}
      - name: {{ .Values.controller.tmm_pod_manager.name }}
        image: "{{ .Values.controller.tmm_pod_manager.image.repository | required ".Values.controller.tmm_pod_manager.image.repository is required." }}/{{ .Values.controller.tmm_pod_manager.image.name }}:{{ .Values.controller.tmm_pod_manager.image.tag }}"
        imagePullPolicy: {{ .Values.controller.tmm_pod_manager.image.pullPolicy }}
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        {{- if .Values.controller.command_ve }}
        command:
        {{ toYaml .Values.controller.command_ve | nindent 10 }}
        {{- end }}
        {{- else }}
        {{- if .Values.controller.command_cnf }}
        command:
        {{ toYaml .Values.controller.command_cnf | nindent 10 }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.controller.tmm_pod_manager.f5_csm_qkview.grpc_port }}
          name: qkview-collect
          protocol: TCP
        volumeMounts:
        - name: vol-mount-tmp
          mountPath: /tmp
          subPath: qkview-tmp 
          readOnly: false
        - name: vol-mount-run
          mountPath: /run
          subPath: qkview-run 
          readOnly: false
        - name: vol-mount-logs
          mountPath: /logs
          subPath: qkview-logs 
          readOnly: false 
        - name: f5-msg-pipes
          mountPath: /var/run/msg 
        {{- if (eq .Values.global.platformType "mbip-ve") }}
        - name: pv-data
          subPath: tpm-grpc-clt
          mountPath: /tls/tpm/grpc/clt
        - name: pv-data
          subPath: tpm-grpc-svr
          mountPath: /tls/tpm/grpc/svr
        - name: pv-data
          subPath: logs
          mountPath: /logs
        {{- else }}          
        {{- include "volumeMounts.spk" . | nindent 8 }}
        - name: tls-tpm-grpc-clt-volume
          mountPath: /tls/tpm/grpc/clt
          readOnly: true
        - name: tls-tpm-grpc-svr-volume
          mountPath: /tls/tpm/grpc/svr
          readOnly: true
        {{- end }}
{{- if (eq .Values.global.platformType "robin") }}
        - name: f5-core-store
          mountPath: /var/crash
          readOnly: false
{{- end }}
{{- if .Values.controller.fluentbit_sidecar.enabled }}
        - name: f5-log-pipes
          mountPath: /var/run/f5
{{- end }}
        {{- if .Values.controller.tmm_pod_manager.resources }}
        resources:
{{ toYaml .Values.controller.tmm_pod_manager.resources | indent 10 }}
        {{- end }}
        {{- if .Values.controller.tmm_pod_manager.securityContext }}
        securityContext:
          readOnlyRootFilesystem: {{ .Values.controller.tmm_pod_manager.securityContext.readOnlyRootFilesystem }}
          {{- if .Values.controller.tmm_pod_manager.securityContext.runAsNonRoot }}
          runAsNonRoot: {{ .Values.controller.tmm_pod_manager.securityContext.runAsNonRoot }}
          {{- end }}
          {{- if .Values.controller.tmm_pod_manager.securityContext.runAsUser }}
          runAsUser: {{ .Values.controller.tmm_pod_manager.securityContext.runAsUser }}
          {{- end }}
          {{- if .Values.controller.tmm_pod_manager.securityContext.runAsGroup }}
          runAsGroup: {{ .Values.controller.tmm_pod_manager.securityContext.runAsGroup }}
          {{- end }}
        {{- end }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
