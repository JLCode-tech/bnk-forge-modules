          limits:
            memory: {{ .Values.controller.crdupdater.resources.limits.memory | default "512Mi" }}
            cpu: {{ .Values.controller.crdupdater.resources.limits.cpu | default "1" }}
          {{- end }}
          {{- if .Values.controller.crdupdater.resources.requests }}
          requests:
            memory: {{ .Values.controller.crdupdater.resources.requests.memory | default "256Mi" }}
            cpu: {{ .Values.controller.crdupdater.resources.requests.cpu | default "0.5" }}
          {{- end }}
        {{- end }}
        volumeMounts:
        - name: vol-mount-tmp
