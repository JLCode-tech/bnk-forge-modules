          periodSeconds: {{ .Values.controller.crdupdater.k8sprobes.readinessProbe.periodSeconds }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.controller.crdupdater.grpc.port }}
          initialDelaySeconds: {{ .Values.controller.crdupdater.k8sprobes.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.controller.crdupdater.k8sprobes.livenessProbe.periodSeconds }}
