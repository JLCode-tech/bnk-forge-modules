          value: {{ if .Values.controller.crdupdater.debug }}"debug"{{ else }}{{ .Values.controller.crdupdater.log_level | default "notice" }}{{ end }}
        - name: CFG_DBG_ENABLED
          value: {{ if .Values.controller.crdupdater.debug }}"true"{{ else }}"false"{{ end }}
        - name: WRITE_BLOB_TO_FILE
          value: {{ if .Values.controller.crdupdater.debug }}"true"{{ else }}"false"{{ end }}
        - name: USING_CERT_ORCHESTRATOR
          value: "true"
        {{- if .Values.controller.fluentbit_sidecar.enabled }}
        - name: SIDECAR_ENABLED
          value: "true"
        {{- end }}
        {{- if .Values.controller.crdupdater.k8sprobes.enabled }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.controller.crdupdater.grpc.port }}
