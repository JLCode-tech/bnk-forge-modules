          value: {{ (index .Values "f5-tmm").tmm.grpc.name }}
        - name: PATH_CERTS
          value: "/tls/crdupdater/grpc/svr"
        - name: PATH_KEYS
          value: "/tls/crdupdater/grpc/svr"
