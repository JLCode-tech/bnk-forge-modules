# Check if CEC/PEM Global Options CRD is present in the cluster.
{{- if (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "f5-big-dpi-pe-optionses.k8s.f5net.com") }}
apiVersion: k8s.f5net.com/v1
kind: F5BigDpiPeOptions
metadata:
  name: dpi-pe-default-options
{{- if (lookup "k8s.f5net.com/v1" "F5BigDpiPeOptions" .Release.Namespace "dpi-pe-default-options") }}
# Apply the contents of the existing CR,this is being done to ensure the resource is not empty.
{{- $peOptions := (lookup "k8s.f5net.com/v1" "F5BigDpiPeOptions" .Release.Namespace "dpi-pe-default-options") }}

spec: 
{{- toYaml $peOptions.spec | nindent 2 }}

{{ else }}

spec: {}

{{- end }}
---

{{- range $crIdx, $cr := (lookup "k8s.f5net.com/v1" "F5BigDpiPeOptions" .Release.Namespace "").items }}
  # Check the index of current CR.
  {{- if ge $crIdx 1 }}
    # Halt the installation if there is more than one present.
    {{ required "Deployment failed. The one single valid resource of this type can only have name of dpi-pe-default-options" nil }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: ResourceQuota
metadata:
  name: f5-single-dpi-pem-options-quota
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install
spec:
  hard:
    count/f5-big-dpi-pe-optionses.k8s.f5net.com: 1

{{- end }}
