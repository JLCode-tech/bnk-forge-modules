# f5-values-eks.yaml
global:
  imagePullSecrets:
    - name: far-secret
  tmmDefaultMTU: 9001
  afm:
    enabled: true
  pccd:
    enabled: true

# ===== F5 TMM =====
f5-tmm:
  enabled: true
  
  serviceAccount:
    create: true
    name: f5ingress-f5-tmm
  
  # Debug and Blobd
  debug:
    enabled: true
    image:
      repository: repo.f5.com/images
    rabbitmqNamespace: f5-utils
  
  blobd:
    enabled: true
    image:
      repository: repo.f5.com/images
  
  tmm:
    replicaCount: 2
    image:
      repository: repo.f5.com/images
    
    # Node selection (EKS)
    nodeSelector:
      node-type: high-performance
    
    tolerations:
      - key: f5.com/spk-node
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: high-performance
        operator: Equal
        value: "true"
        effect: NoSchedule
    
    # Anti-affinity across AZs
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values: ["f5-tmm"]
            topologyKey: topology.kubernetes.io/zone
    
    # Resources with SR-IOV
    resources:
      limits:
        cpu: "4"
        memory: 2Gi
        hugepages-2Mi: 6Gi
        sriovResources:
          intel.com/internal_netdevice: "1"
          intel.com/external_netdevice: "1"
      requests:
        cpu: "4"
        memory: 2Gi
        hugepages-2Mi: 6Gi
        sriovResources:
          intel.com/internal_netdevice: "1"
          intel.com/external_netdevice: "1"
    
    # NAD references (order matters: external, internal)
    cniNetworks: "f5-spk/external-netdevice,f5-spk/internal-netdevice"
    
    # Custom Environment Variables (EKS - NO OPENSHIFT vars)
    customEnvVars:
      # Session DB
      - name: SESSIONDB_DISCOVERY_SENTINEL
        value: "true"
      - name: SESSIONDB_EXTERNAL_SERVICE
        value: "f5-dssm-sentinel.f5-utils.svc.cluster.local:26379"
      # VFIO Resources (maps to SR-IOV resource names)
      - name: PAL_CPU_SET
        value: "0"
      - name: ROBIN_VFIO_RESOURCE_1
        value: "external_netdevice"
      - name: ROBIN_VFIO_RESOURCE_2
        value: "internal_netdevice"
      # Memory and Gateway
      - name: TMM_MAPRES_IGNORE_MEM_LIMIT
        value: "TRUE"
      - name: TMM_MAPRES_DELAY_MS
        value: "4000"
      - name: TMM_IGNORE_GATEWAYS
        value: "TRUE"
      # DO NOT set TMM_DEFAULT_MTU - use global.tmmDefaultMTU
      # DO NOT set PCIDEVICE vars - SR-IOV plugin auto-injects
    
    # Session DB
    sessiondb:
      useExternalStorage: "true"
    
    # Dynamic Routing / BGP
    dynamicRouting:
      enabled: true
      exportZebosLogs: true
      tmmRouting:
        image:
          repository: repo.f5.com/images
        config:
          bgp:
            asn: 65000
            hostname: spk-bgp
            neighbors:
              - ip: 172.16.100.1
                asn: 65100
                ebgpMultihop: 2
                acceptsIPv4: true
                softReconf: true
                maxPathsEbgp: 8
              - ip: 172.16.102.1
                asn: 65100
                ebgpMultihop: 2
                acceptsIPv4: true
                softReconf: true
                maxPathsEbgp: 8
      tmrouted:
        image:
          repository: repo.f5.com/images
    
    # TLS Store (if using HTTP2)
    tlsStore:
      enabled: false
  
  # Observer (V2 Metrics)
  observer:
    enabled: true
    image:
      repository: repo.f5.com/images
  
  # TMStats (disabled when observer enabled)
  tmstats:
    enabled: false
  
  # Fluentbit (under f5-tmm, not tmm)
  fluentbit_sidecar:
    enabled: true
    fluentd:
      host: fluentd.f5-utils.svc.cluster.local
      port: 24224
    image:
      repository: repo.f5.com/images

# ===== F5 AFM =====
f5-afm:
  enabled: true
  serviceAccount:
    create: true
    name: f5-afm
  cert-orchestrator:
    enabled: true
  afm:
    pccd:
      enabled: true
      image:
        repository: repo.f5.com/images
    fluentbit_sidecar:
      fluentd:
        host: fluentd.f5-utils.svc.cluster.local
      image:
        repository: repo.f5.com/images

# ===== F5 OTEL Stats Collector =====
f5-stats_collector:
  enabled: true
  serviceAccount:
    create: true
    name: f5-stats-collector
  image:
    name: opentelemetry-collector-contrib
    repository: repo.f5.com/images
  stats_collector:
    image:
      name: opentelemetry-collector-contrib
      repository: repo.f5.com/images

# ===== Controller =====
controller:
  serviceAccount:
    create: true
    name: f5ingress-f5ingress
  image:
    repository: repo.f5.com/images
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  watchNamespace:
    - "f5-spk"
  
  tmm_pod_manager:
    image:
      repository: repo.f5.com/images
  
  f5_lic_helper:
    enabled: true
    rabbitmqNamespace: f5-utils
    image:
      repository: repo.f5.com/images
  
  fluentbit_sidecar:
    enabled: true
    fluentd:
      host: fluentd.f5-utils.svc.cluster.local
      port: 24224
    image:
      repository: repo.f5.com/images

# ===== F5 TODA Logging =====
f5-toda-logging:
  enabled: true
  serviceAccount:
    create: true
    name: f5-toda-logging
  fluentd:
    host: fluentd.f5-utils.svc.cluster.local
    port: 24224
  sidecar:
    image:
      repository: repo.f5.com/images